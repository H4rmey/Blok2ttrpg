version: 1
profile_id: ability-builder
combat:
  actions:
    amount: 3
additional_enactment:
  build_cost: 1
  energy_cost: 1
  description: "Adding an additional Enactment beyond the first"
trait_categories:
  - general
  - offense
  - defense
# System 1: costed option sources. Entries in these lists each carry their own
# build/energy cost. A field referencing one of these names via options_source
# shows the (-/+x pt, -/+y E) hint per entry and the engine adds the selected
# entry's cost. A costed source takes precedence over a plain option_sources
# entry of the same name.
option_sources_costed:
  # Per-damage-type build cost for the follow-up dropdown of typed damage
  # triggers. Common/mundane damage is cheap (+0); rarer or more potent
  # elemental/exotic damage costs more, on a +0..+6 scale.
  damage_types:
    - value: "Physical"
      cost: { build_cost: 0 }
    - value: "Slashing"
      cost: { build_cost: 0 }
    - value: "Piercing"
      cost: { build_cost: 0 }
    - value: "Bludgeoning"
      cost: { build_cost: 0 }
    - value: "Fire"
      cost: { build_cost: 2 }
    - value: "Cold"
      cost: { build_cost: 2 }
    - value: "Lightning"
      cost: { build_cost: 2 }
    - value: "Thunder"
      cost: { build_cost: 2 }
    - value: "Acid"
      cost: { build_cost: 3 }
    - value: "Poison"
      cost: { build_cost: 3 }
    - value: "Psychic"
      cost: { build_cost: 4 }
    - value: "Necrotic"
      cost: { build_cost: 4 }
    - value: "Radiant"
      cost: { build_cost: 4 }
    - value: "Force"
      cost: { build_cost: 5 }
    - value: "Arcane"
      cost: { build_cost: 5 }
    - value: "Nature"
      cost: { build_cost: 3 }
    - value: "Holy"
      cost: { build_cost: 5 }
    - value: "Shadow"
      cost: { build_cost: 5 }
    - value: "Chaos"
      cost: { build_cost: 6 }

  # Per-weapon-type build cost for the "gets hit by a weapon of a type"
  # follow-up dropdown. Common weapons are cheap; specialised/ranged/exotic
  # weapons cost more, on a +0..+6 scale.
  weapon_types:
    - value: "Unarmed"
      cost: { build_cost: 0 }
    - value: "Sword"
      cost: { build_cost: 0 }
    - value: "Axe"
      cost: { build_cost: 0 }
    - value: "Mace"
      cost: { build_cost: 0 }
    - value: "Spear"
      cost: { build_cost: 1 }
    - value: "Dagger"
      cost: { build_cost: 1 }
    - value: "Bow"
      cost: { build_cost: 2 }
    - value: "Crossbow"
      cost: { build_cost: 2 }
    - value: "Thrown"
      cost: { build_cost: 2 }
    - value: "Firearm"
      cost: { build_cost: 4 }
    - value: "Staff"
      cost: { build_cost: 3 }
    - value: "Wand"
      cost: { build_cost: 3 }
    - value: "Shield"
      cost: { build_cost: 2 }

  # Balanced per-knockout costs for Phase abilities. A knockout is a condition
  # that interrupts an active Phase, so it is a drawback: the more easily a
  # knockout can be triggered, the larger the build discount it grants. "None"
  # (no way to interrupt) is a benefit and therefore costs build points.
  knockout_options:
    - value: "None"
      cost:
        build_cost: 3
    - value: "Engager takes damage"
      cost:
        build_cost: -1
    - value: "Engager falls unconscious"
      cost:
        build_cost: 0
    - value: "Engager dies"
      cost:
        build_cost: 1
    - value: "Engager gets grabbed or restrained"
      cost:
        build_cost: -1
    - value: "Engager moves voluntarily"
      cost:
        build_cost: -2
    - value: "Engager is moved by another effect"
      cost:
        build_cost: -1
    - value: "Engager fails a validation"
      cost:
        build_cost: -1
    - value: "Engager uses another phase"
      cost:
        build_cost: 0
    - value: "Engager loses line of sight to target"
      cost:
        build_cost: -1
    - value: "Target moves out of range"
      cost:
        build_cost: -1
    - value: "Target falls unconscious"
      cost:
        build_cost: 0
    - value: "Target dies"
      cost:
        build_cost: 0
    - value: "Target succeeds on a counter roll"
      cost:
        build_cost: -1
    - value: "Phase duration expires"
      cost:
        build_cost: -2
    - value: "Engager runs out of energy"
      cost:
        build_cost: -1

  # Balanced per-event build costs for the reactive Trigger Event dropdown.
  # A trigger is described as a Subject (You / An Ally / An Opponent /
  # Someone Else) plus one of these subject-agnostic events. Common or
  # powerful reactive events cost more; situational or weak events cost less.
  # Baseline is 2 build points. Some events cascade into a follow-up dropdown
  # (damage type, enactment type, trait, state) via visibility_when.
  trigger_events:
    # Movement
    - value: "moves away from you"
      cost:
        build_cost: 2
    - value: "moves towards you"
      cost:
        build_cost: 2
    - value: "moves past you"
      cost:
        build_cost: 2
    - value: "enters interaction range"
      cost:
        build_cost: 3
    - value: "leaves interaction range"
      cost:
        build_cost: 2
    - value: "ends their turn within range"
      cost:
        build_cost: 2
    - value: "is moved by an effect"
      cost:
        build_cost: 2
    # Damage & healing - typed variants keep triggers specific instead of
    # firing on any damage/heal at all.
    - value: "gets hit by damage of a type"
      cost:
        build_cost: 3
    - value: "deals damage of a type"
      cost:
        build_cost: 3
    - value: "gets healed by an ability of a type"
      cost:
        build_cost: 2
    - value: "gets hit by a weapon of a type"
      cost:
        build_cost: 2
    # Abilities & enactments - typed variants for enactment / ability type.
    - value: "starts casting an ability of a type"
      cost:
        build_cost: 4
        energy_cost: 1
    - value: "gets targeted by an ability of a type"
      cost:
        build_cost: 4
        energy_cost: 1
    - value: "gets hit with an enactment of a type"
      cost:
        build_cost: 3
    - value: "resolves an enactment of a type"
      cost:
        build_cost: 3
    # Checks, validations & state - typed variants.
    - value: "makes a trait check of a type"
      cost:
        build_cost: 2
    - value: "fails a validation of a type"
      cost:
        build_cost: 2
    - value: "succeeds on a validation of a type"
      cost:
        build_cost: 2
    - value: "becomes affected by a state of a type"
      cost:
        build_cost: 3
    - value: "recovers from a state of a type"
      cost:
        build_cost: 2
    # Status changes.
    - value: "falls unconscious"
      cost:
        build_cost: 1
    - value: "dies"
      cost:
        build_cost: 1
    # Non-typed "any" events. These fire on the broad category regardless of
    # type, so they have no follow-up dropdown and cost slightly more than the
    # typed variants (a broader trigger is more useful).
    - value: "moves"
      cost:
        build_cost: 2
    - value: "takes any damage"
      cost:
        build_cost: 4
    - value: "deals any damage"
      cost:
        build_cost: 4
    - value: "gets healed"
      cost:
        build_cost: 3
    - value: "casts any ability"
      cost:
        build_cost: 5
        energy_cost: 1
    - value: "gets targeted by any ability"
      cost:
        build_cost: 5
        energy_cost: 1
    - value: "is hit by any enactment"
      cost:
        build_cost: 4
    - value: "makes any trait check"
      cost:
        build_cost: 3
    - value: "fails any validation"
      cost:
        build_cost: 3
    - value: "succeeds on any validation"
      cost:
        build_cost: 3
    - value: "becomes affected by any state"
      cost:
        build_cost: 4
    - value: "recovers from any state"
      cost:
        build_cost: 3



option_sources:
  # Who the reactive trigger watches. Paired with a trigger_events entry to
  # form a full trigger, e.g. "An Opponent" + "gets hit by damage of a type".
  trigger_subjects:
    - You
    - An Ally
    - An Opponent
    - Someone Else
  # Broad weapon categories, used by the "gets hit by a weapon of a type"
  # trigger.
  weapon_types:
    - Unarmed
    - Sword
    - Axe
    - Mace
    - Spear
    - Dagger
    - Bow
    - Crossbow
    - Thrown
    - Firearm
    - Staff
    - Wand
    - Shield
  damage_types:

    - Physical

    - Slashing
    - Piercing
    - Bludgeoning
    - Fire
    - Cold
    - Lightning
    - Thunder
    - Acid
    - Poison
    - Psychic
    - Necrotic
    - Radiant
    - Force
    - Arcane
    - Nature
    - Holy
    - Shadow
    - Chaos
  directions_all:

    - North
    - East
    - South
    - West
    - Up
    - Down
    - Any
  directions:
    - North
    - East
    - South
    - West
    - Up
    - Down
    - Any
  shift_directions:
    - UP
    - DOWN
  trigger_timings:
    - Start of Target Turn
    - End of Engager Turn
  aoe_trigger_timings:
    - Start of Target Turn
    - End of Engager Turn
  # When a Concentration ability re-triggers its Enactments each round.
  concentration_timings:
    - Start of Engager Turn
    - End of Engager Turn
  # How the per-round upkeep of a Concentration ability is paid.
  concentration_upkeep:
    - 1 Action or 1 Energy
    - 1 Action
    - 1 Energy
dice:

  damage:
    - "d4"
    - "d6"
    - "d8"
    - "d10"
    - "d12"
  generic:
    - "d6"
    - "d8"
    - "d10"
    - "d12"
validations:
  fields:

    - key: engage_mode
      label: "Engage Roll Type"
      type: dropdown
      default: trait
      options:
        - value: trait
          label: "Trait Roll"
        - value: generic
          label: "Generic Roll"
          cost:
            build_cost: -2
            energy_cost: 0
        - value: other
          label: "Another roll result"
          cost:
            build_cost: 3
            energy_cost: 1
        - value: previous
          label: "Use result of previous interaction"
          cost:
            build_cost: 3
            energy_cost: 1
    - key: engage_trait
      label: "Trait"
      type: dropdown
      options_source: traits_all
      visibility_when: engage_mode
      show_when: trait
      # The engagement roll is expected to use an Offensive trait. Choosing a
      # trait from any other category costs extra build points.
      group_offsets:
        default_group: offense
        offsets:
          offense:
            build_cost: 0
          general:
            build_cost: 2
          defense:
            build_cost: 2
    - key: engage_die
      label: "Generic Die"
      type: dropdown
      default: d6
      visibility_when: engage_mode
      show_when: generic
      # A generic engagement roll scales in cost with the die size chosen: a
      # bigger die is a stronger roll and costs more build points.
      options:
        - value: d6
          label: "d6"
        - value: d8
          label: "d8"
          cost:
            build_cost: 1
        - value: d10
          label: "d10"
          cost:
            build_cost: 2
        - value: d12
          label: "d12"
          cost:
            build_cost: 3

    - key: engage_other
      label: "Other Roll Text"
      type: free_text
      visibility_when: engage_mode
      show_when: other
    - key: counter_trait
      label: "Counter Trait"
      type: solutions
      default_count: 2
      options_source: traits_all
      row_defaults:
        - value: "defense.Reflex"
        - value: "defense.Constitution"
      row_fields:
        - key: value
          label: "Counter Trait"
          type: dropdown
          options_source: traits_all
          # A counter roll is expected to use a Defensive trait. Choosing a
          # trait from any other category costs extra build points.
          group_offsets:
            default_group: defense
            offsets:
              defense:
                build_cost: 0
              offense:
                build_cost: 2
              general:
                build_cost: 2
      per_item:
        increase:
          build_cost: 0
          energy_cost: 0
        decrease:
          build_cost: 3
          energy_cost: 1
