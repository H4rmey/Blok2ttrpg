ability_types:
  execution:
    name: "Execution"
    description: "Performed instantly during a character's turn."
    base_energy: 3
    base_action: 2
    fields:

      - key: item_dep
        label: "Has Item Dependency"
        type: checkbox
        cost:
          build_cost: -1
          energy_cost: 0
      - key: item_name
        label: "Item Name"
        type: free_text
        visibility_when: item_dep
        show_when: "true"
      - key: energy_steps
        label: "Energy +/-"
        type: free_number
        default: 0
        min: -2
        max: 2
        step: 1
        per_step:
          increase:
            build_cost: -2
            energy_cost: 1
          decrease:
            build_cost: 3
            energy_cost: -1
      - key: action_steps
        label: "Action +/-"
        type: free_number
        default: 0
        min: -1
        max: 1
        step: 1
        per_step:
          increase:
            build_cost: -2
            energy_cost: 0
          decrease:
            build_cost: 4
            energy_cost: 1

  reaction:
    name: "Reaction"
    description: "Triggered in response to an event or enemy action."
    base_energy: 3
    base_action: 0
    base_range: 1
    base_uses: 1
    fields:

      - key: item_dep
        label: "Has Item Dependency"
        type: checkbox
        cost:
          build_cost: -1
          energy_cost: 0
      - key: item_name
        label: "Item Name"
        type: free_text
        visibility_when: item_dep
        show_when: "true"
      # Triggers are a repeatable set of rows. Each row is a Subject
      # (You / An Ally / An Opponent / Someone Else) plus an Event. Per-event
      # build costs come from the costed option source (trigger_events); every
      # "of a type" event cascades into a per-row follow-up dropdown
      # (damage/weapon/ability/enactment/trait/state) via visibility_when,
      # which resolves against the sibling "event" row field. Adding extra
      # trigger rows beyond the first costs additional build points.
      - key: triggers
        label: "Triggers"
        type: solutions
        default_count: 1
        per_item:
          increase:
            build_cost: 2
        row_fields:
          - key: subject
            label: "Subject"
            type: dropdown
            options_source: trigger_subjects
          - key: event
            label: "Event"
            type: dropdown
            options_source: trigger_events
          - key: damage_type_hit
            label: "Damage Type"
            type: dropdown
            options_source: damage_types
            visibility_when: event
            show_when: "gets hit by damage of a type"
          - key: damage_type_dealt
            label: "Damage Type"
            type: dropdown
            options_source: damage_types
            visibility_when: event
            show_when: "deals damage of a type"
          - key: weapon_type
            label: "Weapon Type"
            type: dropdown
            options_source: weapon_types
            visibility_when: event
            show_when: "gets hit by a weapon of a type"
          - key: heal_ability_type
            label: "Ability Type"
            type: dropdown
            options_source: ability_types
            visibility_when: event
            show_when: "gets healed by an ability of a type"
          - key: cast_ability_type
            label: "Ability Type"
            type: dropdown
            options_source: ability_types
            visibility_when: event
            show_when: "starts casting an ability of a type"
          - key: targeted_ability_type
            label: "Ability Type"
            type: dropdown
            options_source: ability_types
            visibility_when: event
            show_when: "gets targeted by an ability of a type"
          - key: enactment_type_hit
            label: "Enactment Type"
            type: dropdown
            options_source: enactment_types
            visibility_when: event
            show_when: "gets hit with an enactment of a type"
          - key: enactment_type_resolved
            label: "Enactment Type"
            type: dropdown
            options_source: enactment_types
            visibility_when: event
            show_when: "resolves an enactment of a type"
          - key: trait
            label: "Trait"
            type: dropdown
            options_source: traits_all
            visibility_when: event
            show_when: "makes a trait check of a type"
          - key: fail_validation_trait
            label: "Validation Trait"
            type: dropdown
            options_source: traits_all
            visibility_when: event
            show_when: "fails a validation of a type"
          - key: succeed_validation_trait
            label: "Validation Trait"
            type: dropdown
            options_source: traits_all
            visibility_when: event
            show_when: "succeeds on a validation of a type"
          - key: state_applied
            label: "State"
            type: dropdown
            options_source: states_all
            visibility_when: event
            show_when: "becomes affected by a state of a type"
          - key: state_recovered
            label: "State"
            type: dropdown
            options_source: states_all
            visibility_when: event
            show_when: "recovers from a state of a type"
      - key: range
        label: "Range"
        type: free_number
        default: 1
        min: 1
        max: 6
        step: 1
        per_step:
          increase:
            build_cost: 1
            energy_cost: 0
      - key: uses
        label: "Uses"
        type: free_number
        default: 1
        min: 1
        max: 3
        step: 1
        per_step:
          increase:
            build_cost: 4
            energy_cost: 1
      - key: energy_steps
        label: "Energy +/-"
        type: free_number
        default: 0
        min: -2
        max: 2
        step: 1
        per_step:
          increase:
            build_cost: -2
            energy_cost: 1
          decrease:
            build_cost: 3
            energy_cost: -1

  phase:
    name: "Phase"
    description: "Requires setup or charging time before execution."
    base_energy: 3
    base_action: 2
    base_duration: 2
    base_reverse_duration: 2
    fields:

      - key: item_dep
        label: "Has Item Dependency"
        type: checkbox
        cost:
          build_cost: -1
          energy_cost: 0
      - key: item_name
        label: "Item Name"
        type: free_text
        visibility_when: item_dep
        show_when: "true"
      - key: phase_rounds
        label: "Phase Duration"
        type: free_number
        default: 2
        min: 2
        max: 5
        step: 1
        per_step:
          increase:
            build_cost: 2
            energy_cost: 1
      - key: reverse_rounds
        label: "Reverse Rounds"
        type: free_number
        default: 1
        min: 1
        max: 5
        step: 1
        per_step:
          increase:
            build_cost: 4
            energy_cost: 0
          decrease:
            build_cost: -4
            energy_cost: 0
      - key: action_steps
        label: "Action +/-"
        type: free_number
        default: 0
        min: -1
        max: 1
        step: 1
        per_step:
          increase:
            build_cost: -2
            energy_cost: 0
          decrease:
            build_cost: 4
            energy_cost: 1

      - key: all_req
        label: "All knockout requirements have to be met"
        type: checkbox
        cost:
          build_cost: 3
          energy_cost: 0
      - key: reverse_knockout
        label: "Knockout can be used on the reverse phase"
        type: checkbox
        cost:
          build_cost: 3
          energy_cost: 0
      - key: no_knockout
        label: "No knockout possible"
        type: checkbox
        cost:
          build_cost: 5
          energy_cost: 0
      - key: knockout
        label: "Knockout Requirements"
        type: solutions
        default_count: 1
        options_source: knockout_options
        row_fields:
          - key: value
            label: "Knockout"
            type: dropdown
            # Each knockout carries its own balanced build cost from the costed
            # option source, so no flat per_item cost is applied here.
            options_source: knockout_options

  minion:
    name: "Minion"
    description: "Summons entities that act independently."
    base_energy: 0
    base_health: 10
    base_lifetime: 3
    fields:

      - key: item_dep
        label: "Has Item Dependency"
        type: checkbox
        cost:
          build_cost: -1
          energy_cost: 0
      - key: item_name
        label: "Item Name"
        type: free_text
        visibility_when: item_dep
        show_when: "true"
      - key: hp
        label: "Health Bonus"
        type: free_number
        default: 0
        min: 0
        max: 5
        step: 1
        per_step:
          increase:
            build_cost: 1
            energy_cost: 0
      - key: life
        label: "Extra Lifetime"
        type: free_number
        default: 0
        min: 0
        max: 5
        step: 1
        per_step:
          increase:
            build_cost: 1
            energy_cost: 1

