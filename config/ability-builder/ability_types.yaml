      - key: action_steps
        label: "Action +/-"
        type: free_number
        default: 0
        min: -1
        max: 1
        step: 1
        per_step:
          increase:
            build_cost: -2
            energy_cost: 0
          decrease:
            build_cost: 1
            energy_cost: 4
      - key: energy_steps
        label: "Energy +/-"
        type: free_number
        default: 0
        min: -2
        max: 2
        step: 1
        per_step:
          increase:
            build_cost: -2
            energy_cost: 1
          decrease:
            build_cost: 3
            energy_cost: -1

  concentration:
    name: "Concentration"
    description: "An effect that persists over multiple rounds as long as the Engager maintains focus. It costs Actions and Energy to initiate, then re-triggers its Enactments every round at the chosen point in the turn as long as the upkeep is paid."
    base_energy: 3
    base_action: 2
    base_upkeep_action: 1
    base_upkeep_energy: 1
    fields:

      - key: item_dep
        label: "Has Item Dependency"
        type: checkbox
        cost:
          build_cost: -1
          energy_cost: 0
      - key: item_name
        label: "Item Name"
        type: free_text
        visibility_when: item_dep
        show_when: "true"
      - key: trigger_timing

        label: "Re-trigger Timing"
        type: dropdown
        options_source: concentration_timings
      - key: upkeep_cost
        label: "Upkeep Cost"
        type: dropdown
        options_source: concentration_upkeep
      - key: energy_steps
        label: "Energy +/-"
        type: free_number
        default: 0
        min: -2
        max: 2
        step: 1
        per_step:
          increase:
            build_cost: -2
            energy_cost: 1
          decrease:
            build_cost: 3
            energy_cost: -1
      - key: action_steps
        label: "Action +/-"
        type: free_number
        default: 0
        min: -1
        max: 1
        step: 1
        per_step:
          increase:
            build_cost: -2
            energy_cost: 0
          decrease:
            build_cost: 4
            energy_cost: 1
      - key: effortless

        label: "Effortless (upkeep is free)"
        type: checkbox
        cost:
          build_cost: 3
          energy_cost: 0
      - key: iron_will
        label: "Iron Will (shift counter roll up on damage)"
        type: checkbox
        cost:
          build_cost: 2
          energy_cost: 0
      - key: dual_focus
        label: "Dual Focus (allow a second Concentration)"
        type: checkbox
        cost:
          build_cost: 5
          energy_cost: 0

  passive:
    name: "Passive"
    description: "An always-on effect that costs no Energy or Actions to use and can trigger whenever its condition is met. In exchange for being free to use it carries a higher base build cost."
    base_energy: 0
    base_action: 0
    base_range: 1
    base_uses: 1
    base_cost:
      build_cost: 8
    fields:

      - key: item_dep
        label: "Has Item Dependency"
        type: checkbox
        cost:
          build_cost: -1
          energy_cost: 0
      - key: item_name
        label: "Item Name"
        type: free_text
        visibility_when: item_dep
        show_when: "true"
      # Triggers are a repeatable set of rows; see the Reaction ability type
      # for the full trigger cascade design notes. Extra rows cost extra.
      - key: triggers
        label: "Triggers"
        type: solutions
        default_count: 1
        per_item:
          increase:
            build_cost: 2
        row_fields:
          - key: subject
            label: "Subject"
            type: dropdown
            options_source: trigger_subjects
          - key: event
            label: "Event"
            type: dropdown
            options_source: trigger_events
          - key: damage_type_hit
            label: "Damage Type"
            type: dropdown
            options_source: damage_types
            visibility_when: event
            show_when: "gets hit by damage of a type"
          - key: damage_type_dealt
