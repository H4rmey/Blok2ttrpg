# Character attribute sections. These are free-form character sheet fields
# stored generically on the character. They do not affect ability cost.
# Both groups below are presented under the "Attributes" heading on the
# character page; the dice-backed trait groups render under "Skills".
attributes:
  identity:
    label: "Identity"
    fields:
      - key: name
        label: "Name"
        type: free_text
      - key: age
        label: "Age"
        type: free_text
      - key: description
        label: "Description"
        type: free_text
  traits:
    label: "Traits"
    fields:
      - key: motivation
        label: "Motivation"
        type: free_text
      - key: problem
        label: "Problem"
        type: free_text
      - key: trait_1
        label: "Trait 1"
        type: free_text
      - key: trait_2
        label: "Trait 2"
        type: free_text
      - key: trait_3
        label: "Trait 3"
        type: free_text
