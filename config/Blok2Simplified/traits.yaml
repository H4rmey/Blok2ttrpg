# Dice-backed skill groups. These render under the "Skills" heading on the
# character page and each selection costs skill (trait) points.
traits:
  general:
    - Stealth
    - Perception
    - Nature
    - Crafting
    - People Skill
    - Performance
    - Thievery
    - Knowledge
    - Magic
    - Medicine
    - Provoke
    - Intimidate
    - Athletics
    - Deceive
    - Resources

  offense:
    - Strength
    - Precision
    - Wisdom
    - Magic
  defense:
    - Constitution
    - Reflex
    - Wisdom
    - Magic
  vital:
    - HP
    - Movement
    - Energy
