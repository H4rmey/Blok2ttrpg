ability_types:
  information: "Decide the timing of when the ability triggers"
  render_information: false
  execution:
    name: "Execution"
    information: "Execution is the most basic form for an Ability. It is simply the: \"I want to do this now\" Ability Type. Executions can be anything from casting a fireball to summoning a shield to block an attack or preparing a parry."
    render_information: false
    # Component cost must be nested under base_cost; a top-level build_cost key
    # is not read by the loader and silently made this ability type free.
    base_cost:
      build_cost: 1
      energy_cost: 0


  concentration:
    name: "Concentration"
    information: "Concentration is an Ability Type that allows an effect to persist over multiple rounds, as long as the Engager actively maintains focus. It takes one action to start the Concentration and then at the start of each of your turns you have to spend energy for the upkeep."
    render_information: false
    base_cost:
      build_cost: 2
      energy_cost: 0
    base_upkeep_action: 1
    base_upkeep_energy: 1
    fields:
      - key: upkeep_cost
        label: "Upkeep Cost"
        type: dropdown
        options_source: concentration_upkeep
