  concentration:
    name: "Concentration"
    description: "An effect that persists over multiple rounds as long as the Engager maintains focus. It costs Actions and Energy to initiate, then re-triggers its Enactments every round as long as the upkeep is paid."
    information: "Concentration is an Ability Type that allows an effect to persist over multiple rounds, as long as the Engager actively maintains focus. It takes one action to start the Concentration and then at the start of each of your turns you have to spend energy for the upkeep."
    render_information: true
    base_energy: 3

    base_action: 2
    base_upkeep_action: 1
    base_upkeep_energy: 1
    fields:
      - key: comment
        label: "Comment"
        type: free_text
      - key: energy_steps
        label: "Energy +/-"
        type: free_number
        default: 0
        min: -2
        max: 2
        step: 1
        per_step:
          increase:
            build_cost: 02
            energy_cost: 0
          decrease:
            build_cost: 0
            energy_cost: 01
      - key: action_steps
        label: "Action +/-"
        type: free_number
        default: 0
        min: -1
        max: 1
        step: 1
        per_step:
          increase:
            build_cost: 02
            energy_cost: 0
          decrease:
            build_cost: 0
            energy_cost: 0
      - key: upkeep_cost
        label: "Upkeep Cost"
        type: dropdown
        options_source: concentration_upkeep
      - key: effortless
        label: "Effortless (upkeep is free)"
        type: checkbox
        cost:
          build_cost: 0
          energy_cost: 0

  passive:
    name: "Passive"
    description: "An always-on effect that costs no Energy or Actions to use and can trigger whenever its condition is met. In exchange for being free to use it carries a higher base build cost."
    information: "Passives are Abilities that are always on. They work just like a Reaction, they trigger when something happens, but unlike a Reaction a Passive does not cost any Energy or Actions to use and is not bound to your action economy at all. Whenever the trigger happens, the linked Enactment is executed. For example, you could have a passive that triggers whenever someone damages you, Enacting a small healing effect on yourself. Because a Passive is free to use and can trigger whenever, it is the most expensive Ability Type to build."
    render_information: true
    base_energy: 0

    base_action: 0
    base_range: 1
    base_uses: 1
    base_cost:
