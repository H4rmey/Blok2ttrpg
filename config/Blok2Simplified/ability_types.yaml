perk_types:
  information: "Decide the timing of when the perk triggers"
  render_information: false
  execution:
    name: "Execution"
    information: "Execution is the most basic form for an Perk. It is simply the: \"I want to do this now\" Perk Type. Executions can be anything from casting a fireball to summoning a shield to block an attack or preparing a parry."
    render_information: false
    # Component cost must be nested under base_cost; a top-level build_cost key
    # is not read by the loader and silently made this perk type free.
    #
    # Using a perk costs 1 energy per enactment. The first enactment is paid for
    # here; each additional one adds another point via
    # additional_enactment.energy_cost, so a two-enactment perk costs 2 energy.
    base_cost:
      build_cost: 1
      energy_cost: 1


  concentration:
    name: "Concentration"
    information: "Concentration is an Perk Type that allows an effect to persist over multiple rounds, as long as the Engager actively maintains focus. It takes one action to start the Concentration and then at the start of each of your turns you have to spend energy for the upkeep."
    render_information: false
    # As with execution, activation costs 1 energy per enactment. This is
    # separate from base_upkeep_energy, which is the per-round cost of keeping
    # the concentration going.
    base_cost:
      build_cost: 2
      energy_cost: 1
    base_upkeep_action: 1
    base_upkeep_energy: 1
    fields:
      - key: upkeep_cost
        label: "Upkeep Cost"
        type: dropdown
        options_source: concentration_upkeep

  reaction:
    name: "Reaction"
    information: "A Reaction is a perk that fires out of turn, when a trigger you picked at build time happens. You do not choose to use it on your turn; you choose the circumstance in advance and it goes off when that circumstance arrives. You may only act out of turn once per round, counting every Reaction you own together with any Invoke Action you improvise."
    render_information: false
    # A reaction costs one more build point and one more energy than an
    # Execution: acting out of turn is worth a premium, and paying for it in
    # both currencies keeps a character from filling their sheet with them.
    #
    # Unlike an improvised Invoke Action (see invoking.invoke_actions) a built
    # Reaction costs no invoke point: it was already paid for at build time.
    base_cost:
      build_cost: 2
      energy_cost: 2
    # Built Reactions are exempt from the invoke point cost an improvised
    # Invoke Action pays. Read by the documentation and the character
    # sheet; the cost engine never charges invoke points in the first place.
    skip_invoke_cost: true
    fields:
      # The circumstance that sets the reaction off. Entries and their costs
      # live in option_sources.reaction_triggers in general.yaml.
      - key: trigger
        label: "Trigger"
        type: dropdown
        options_source: reaction_triggers
        information: "When this reaction goes off. Broader triggers fire more often and therefore cost more build points."
      # How far from you the trigger may happen. This is the watch radius, and
      # is deliberately separate from an enactment's own interaction range: a
      # reaction can watch a wide area and still only reach an adjacent target,
      # or the reverse.
      - key: trigger_range
        label: "Trigger Range"
        type: free_number
        default: 1
        min: 0
        max: 10
        step: 1
        information: "How far away the trigger may happen, in the same units as an interaction range. 0 means it must happen to you or in your own space."
        per_step:
          increase: { build_cost: 1 }
          decrease: { build_cost: -1 }

# Note: there is deliberately no "passive" perk type. A passive is not something
# you build out of enactments, so it has no place in the perk builder's type
# dropdown - it is added with the "Add passive" button and priced from its own
# catalogue entry in passives.yaml.
