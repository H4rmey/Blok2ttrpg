ability_types:
  execution:
    name: "Execution"
    description: "Performed instantly during a character's turn."
    base_energy: 3
    base_action: 2
    fields:
      - key: comment
        label: "Comment"
        type: free_text
      - key: energy_steps
        label: "Energy +/-"
        type: free_number
        default: 0
        min: -2
        max: 2
        step: 1
        per_step:
          increase:
            build_cost: -2
            energy_cost: 1
          decrease:
            build_cost: 3
            energy_cost: -1
      - key: action_steps
        label: "Action +/-"
        type: free_number
        default: 0
        min: -1
        max: 1
        step: 1
        per_step:
          increase:
            build_cost: -2
            energy_cost: 0
          decrease:
            build_cost: 4
            energy_cost: 1

  reaction:
    name: "Reaction"
    description: "Triggered in response to an event or enemy action."
    base_energy: 3
    base_action: 0
    base_range: 1
    base_uses: 1
    fields:
      - key: comment
        label: "Comment"
        type: free_text
      - key: energy_steps
        label: "Energy +/-"
        type: free_number
        default: 0
        min: -2
        max: 2
        step: 1
        per_step:
          increase:
            build_cost: -2
            energy_cost: 1
          decrease:
            build_cost: 3
            energy_cost: -1
      - key: triggers
        label: "Triggers"
        type: solutions
        default_count: 1
        per_item:
          increase:
            build_cost: 2
        row_fields:
          - key: subject
            label: "Subject"
            type: dropdown
            options_source: trigger_subjects
          - key: event
            label: "Event"
            type: dropdown
            options_source: trigger_events
          - key: damage_type_hit
            label: "Damage Type"
            type: dropdown
            options_source: damage_types
            visibility_when: event
            show_when: "gets hit by damage of a type"
          - key: damage_type_dealt
            label: "Damage Type"
            type: dropdown
            options_source: damage_types
            visibility_when: event
            show_when: "deals damage of a type"
          - key: weapon_type
            label: "Weapon Type"
            type: dropdown
            options_source: weapon_types
            visibility_when: event
            show_when: "gets hit by a weapon of a type"
          - key: heal_ability_type
            label: "Ability Type"
            type: dropdown
            options_source: ability_types
            visibility_when: event
            show_when: "gets healed by an ability of a type"
          - key: cast_ability_type
            label: "Ability Type"
            type: dropdown
            options_source: ability_types
            visibility_when: event
            show_when: "starts casting an ability of a type"
          - key: targeted_ability_type
            label: "Ability Type"
            type: dropdown
            options_source: ability_types
            visibility_when: event
            show_when: "gets targeted by an ability of a type"
          - key: enactment_type_hit
            label: "Enactment Type"
            type: dropdown
            options_source: enactment_types
            visibility_when: event
            show_when: "gets hit with an enactment of a type"
          - key: enactment_type_resolved
            label: "Enactment Type"
            type: dropdown
            options_source: enactment_types
            visibility_when: event
            show_when: "resolves an enactment of a type"
          - key: trait
            label: "Trait"
            type: dropdown
            options_source: traits_all
            visibility_when: event
            show_when: "makes a trait check of a type"
          - key: fail_validation_trait
            label: "Validation Trait"
            type: dropdown
            options_source: traits_all
            visibility_when: event
            show_when: "fails a validation of a type"
          - key: succeed_validation_trait
            label: "Validation Trait"
            type: dropdown
            options_source: traits_all
            visibility_when: event
            show_when: "succeeds on a validation of a type"
          - key: state_applied
            label: "State"
            type: dropdown
            options_source: states_all
            visibility_when: event
            show_when: "becomes affected by a state of a type"
          - key: state_recovered
            label: "State"
            type: dropdown
            options_source: states_all
            visibility_when: event
            show_when: "recovers from a state of a type"
      - key: range
        label: "Range"
        type: free_number
        default: 1
        min: 1
        max: 6
        step: 1
        per_step:
          increase:
            build_cost: 1
            energy_cost: 0
      - key: uses
        label: "Uses"
        type: free_number
        default: 1
        min: 1
        max: 3
        step: 1
        per_step:
          increase:
            build_cost: 4
            energy_cost: 1

  phase:
    name: "Phase (Deprecated)"
    description: "Deprecated. Kept for backward compatibility only."
    base_energy: 3
    base_action: 2
    base_duration: 2
    base_reverse_duration: 2
    fields:
      - key: comment
        label: "Comment"
        type: free_text

