ability_types:
  information: "Decide the timing of when the ability triggers"
  render_information: false
  execution:
    name: "Execution"
    information: "Execution is the most basic form for an Ability. It is simply the: \"I want to do this now\" Ability Type. Executions can be anything from casting a fireball to summoning a shield to block an attack or preparing a parry."
    render_information: false
    build_cost: 1
    energy_cost: 0
    fields:
      - key: execution-energy-offset
        label: "Energy Offset +/-"
        information: "Adjust the Energy cost of this ability. Lowering energy costs extra build points; raising it refunds some."
        type: free_number
        default: 0
        min: -2
        max: 2
        step: 1
        per_step:
          increase:
            build_cost: -2
            energy_cost: 1
          decrease:
            build_cost: 2
            energy_cost: -1
      - key: execution-action-offset
        label: "Action offset"
        information: "Normally an ability costs 2 actions to use. This will adjust the amount of Actions it will cost to use this ability"
        type: free_number
        default: 0
        min: -1
        max: 1
        step: 1
        per_step:
          increase:
            build_cost: -1
            energy_cost: 0
          decrease:
            build_cost: 2
            energy_cost: 0

  reaction:
    name: "Reaction"
    information: "Reactions are Abilities that trigger outside your normal action economy. Reactions trigger when someone else does something. When the trigger happens, the linked Enactment is executed."
    render_information: false
    build_cost: 3
    energy_cost: 0
    fields:
      - key: reaction-energy-offset
        label: "Energy Offset +/-"
        information: "Adjust the Energy cost of this ability. Lowering energy costs extra build points; raising it refunds some."
        type: free_number
        default: 0
        min: -2
        max: 2
        step: 1
        per_step:
          increase:
            build_cost: -2
            energy_cost: 1
          decrease:
            build_cost: 2
            energy_cost: -1
      - key: reaction-triggers
        label: "Triggers"
        type: multiselect
        default_count: 1
        per_item:
          increase:
            build_cost: 1
        row_fields:
          - key: subject
            label: "Subject"
            type: dropdown
            options_source: trigger_subjects
          - key: event
            label: "Event"
            type: dropdown
            options_source: trigger_events
          - key: damage_type_hit
            label: "Damage Type"
            type: dropdown
            options_source: damage_types
            visibility_when: event
            show_when: "gets hit by damage of a type"
          - key: damage_type_dealt
            label: "Damage Type"
            type: dropdown
            options_source: damage_types
            visibility_when: event
            show_when: "deals damage of a type"
          - key: weapon_type
            label: "Weapon Type"
            type: dropdown
            options_source: weapon_types
            visibility_when: event
            show_when: "gets hit by a weapon of a type"
          - key: heal_ability_type
            label: "Ability Type"
            type: dropdown
            options_source: ability_types
            visibility_when: event
            show_when: "gets healed by an ability of a type"
          - key: cast_ability_type
            label: "Ability Type"
            type: dropdown
            options_source: ability_types
            visibility_when: event
            show_when: "starts casting an ability of a type"
          - key: targeted_ability_type
            label: "Ability Type"
            type: dropdown
            options_source: ability_types
            visibility_when: event
            show_when: "gets targeted by an ability of a type"
          - key: enactment_type_hit
            label: "Enactment Type"
            type: dropdown
            options_source: enactment_types
            visibility_when: event
            show_when: "gets hit with an enactment of a type"
          - key: enactment_type_resolved
            label: "Enactment Type"
            type: dropdown
            options_source: enactment_types
            visibility_when: event
            show_when: "resolves an enactment of a type"
          - key: trait
            label: "Trait"
            type: dropdown
            options_source: traits_all
            visibility_when: event
            show_when: "makes a trait check of a type"
          - key: fail_validation_trait
            label: "Validation Trait"
            type: dropdown
            options_source: traits_all
            visibility_when: event
            show_when: "fails a validation of a type"
          - key: succeed_validation_trait
            label: "Validation Trait"
            type: dropdown
            options_source: traits_all
            visibility_when: event
            show_when: "succeeds on a validation of a type"
          - key: state_applied
            label: "Condition"
            type: dropdown
            options_source: states_all
            visibility_when: event
            show_when: "becomes affected by a condition of a type"
          - key: state_recovered
            label: "Condition"
            type: dropdown
            options_source: states_all
            visibility_when: event
            show_when: "recovers from a condition of a type"
      - key: reaction-trigger-range
        label: "Trigger Range"
        type: free_number
        default: 1
        min: 1
        max: 6
        step: 1
        per_step:
          increase:
            build_cost: 1
            energy_cost: 0

