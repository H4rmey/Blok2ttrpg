# Point budgets per character level.
#
# Both pools are now derived from a formula rather than a hand-written table:
#
#   budget(level) = start + per_level * (level - 1)
#
# The engine computes this directly, so the numbers documented here are the
# numbers the app serves. An optional `levels:` list may still be supplied to
# override individual levels when a non-linear curve is wanted; a row for the
# requested level wins over the formula.
#
# max_level is enforced: a character's level is clamped to this value on every
# manual edit and on import, so it is not possible to go past level 10.
#
#
# Perk (perk) points
# --------------------
# Tuned so a baseline perk costs about 3 points:
#   execution base_cost 1 + direct interaction base 1 + validation engage d6 1
#   (the first enactment's base_cost is waived by the cost engine).
# start 9 is about 3 starting perks; per_level 3 is about 1 extra perk per
# level, ending at 36 (about 12 perks) at level 10.
#
#
# Skill points
# ------------

# The old "(skill_count + 2) / 3" starting formula no longer matched the cost
# model and has been dropped. Two things broke it:
#
#   1. Every rung of the proficiency ladder in proficiencies.yaml costs 1
#      point (untrained is the free default, legendary is 0), so raising a
#      single skill from untrained to master costs 4 and the whole 26-skill
#      roster costs 104 points to max out. The old curve granted 9 at level 1
#      and only 20 at level 10, under 20% of the ladder, which left a level 10
#      character's dice almost indistinguishable from a level 1 character's.
#   2. The vital group (HP / Movement / Energy) is paid from this same pool, so
#      3 to 6 of those points are effectively mandatory and never reach the 23
#      dice-backed skills.
#
# The rebalanced curve grants 13 at level 1 and +3 per level, reaching 40 at
# level 10 (about 38% of the 104-point ladder):
#
#   L1 13   L2 16   L3 19   L4 22   L5 25
#   L6 28   L7 31   L8 34   L9 37   L10 40
#
# 13 at level 1 buys the three vitals at Novice plus roughly five signature
# skills at Novice, or a pair of skills at Proficient with vitals covered.
# +3 per level is one visible die bump (or one vital step) plus change every
# level, which matches the +3 perk points so the dice half of the sheet grows
# at the same rate as the perk half. 40 at level 10 lets a specialist reach
# Master in two or three skills and stay broadly competent elsewhere, without
# trivialising a 26-skill roster. The arbitrary bonus points that used to be
# handed out at levels 5 and 10 are gone: the flat +3 replaces them.
#
#
# Invoke points
# -------------
# Unlike the two pools above, invoke points are not spent at build time: they
# are a per-session currency refreshed at the start of every session, spent to
# invoke a trait or a reaction and earned back by letting a trait work against
# you. See docs/core/invoking.md and invoking.yaml for what they buy.
#
# The curve uses levels_per_step rather than per_level because the pool is tiny
# and a point is a whole extra scene-changing action: +1 every level would take
# a level 10 character to 12 points, which is more invocations than a session
# has room for. Granting +1 every 2 levels gives 3 at level 1 and 7 at level 10,
# so the pool slightly more than doubles over a campaign while every single
# point stays a real decision.
#
#   L1 3   L2 3   L3 4   L4 4   L5 5
#   L6 5   L7 6   L8 6   L9 7   L10 7
leveling:
  max_level: 10
  skill_points:
    start: 13
    per_level: 3
  perk_points:
    start: 20
    per_level: 4
  invoke_points:
    start: 3
    # per_step points are granted every levels_per_step levels after the first.
    per_step: 1
    levels_per_step: 3

