version: 1
profile_id: blok2simplified
title: "Blok2 Simplified"
# The skill group treated as vitals (HP/Movement/Energy) rather than dice.
vital_group: vital
# Ordered skill categories that make up the grouped "skills_all" source.
skill_categories:
  - general
  - offense
  - defense
combat:
  actions:
    amount: 3
  # Energy regained per rest. A full three-action round costs about 3 Energy,
  # so this is a deliberately slow trickle that keeps Energy scarce between
  # fights. The app never spends or restores Energy by itself; this value is a
  # rules parameter for the table, surfaced in the generated documentation.
  energy_recovery_per_rest: 5

# The proficiency rung every skill starts at, and the one that is free. This
# must be set explicitly: the ladder now opens with the below-baseline "Inept"
# rung, so falling back to the first entry would start every character there.
default_proficiency: untrained

# Cost floors. When false (the default) the final computed build/energy cost of
# a perk is clamped at zero, so refund-style options (e.g. the energy offset,
# Enact Nerf) can never produce a perk that costs less than nothing. Set either
# to true to allow the corresponding total to go negative.
allow_negative_build_cost: false
allow_negative_energy_cost: false

# Skill (skill) point budget enforcement. When false (the default) a character
# may not spend more skill points than its level grants: manual skill edits and
# package imports that would overspend the budget are rejected. Set to true to
# let a character go into negative skill points.
allow_negative_skill_points: false


additional_enactment:
  build_cost: 0
  energy_cost: 1
  description: "Adding an additional Enactment beyond the first"
  # The first enactment always shows an Interaction and Validation region.
  # These flags control whether the second and following enactments must show
  # them. Set to false to hide that region for enactments beyond the first.
  require_interaction: false
  require_validation: false
  # Opt-in surcharge for an enactment beyond the first that picks its own
  # target instead of inheriting the target of the enactment before it.
  # Checking it reveals that enactment's own Interaction and Validation
  # regions, so their cost applies on top of this surcharge.
  new_target:
    build_cost: 1
    energy_cost: 0
    label: "This enactment has a different target than the enactment before it"
    description: "Give an enactment beyond the first its own Interaction and Validation"



# Named option sources. Each entry may be authored as a bare string
# (value == label, no cost) or as a full object with an optional label and
# cost. A field referencing a source via options_source shows the
# (-/+x pt, -/+y E) hint per entry and the engine adds the selected entry's
# cost.
option_sources:
  # Dice half of the combined roll source. Referenced by the "roll_all" grouped
  # source (see option_groups) which renders these as a "Generic" optgroup and
  # then appends the skill categories as grouped optgroups. Used by Damage/Heal/
  # Mitigation "Source" and the Validation "Engage" dropdown. Dice scale in cost
  # with size; skill cost comes from the field's group_offsets.
  #
  # This mirrors the proficiency ladder in proficiencies.yaml: the die is capped
  # at d12 and higher rungs add a flat bonus instead. Each entry raises the
  # average result by 1, so build cost rises by 1 per entry. The old d20 option
  # is gone: it jumped the average by 4 in a single step for 2 points and made
  # the roll wildly swingy.
  roll_generic:
    - value: "1"
      label: "1 (flat, no roll)"
      cost: { build_cost: -1, energy_cost: 0 }
    - value: "d4"
      label: "1d4"
      cost: { build_cost: 0, energy_cost: 0 }
    - value: "d6"
      label: "1d6"
      cost: { build_cost: 1, energy_cost: 0 }
    - value: "d8"
      label: "1d8"
      cost: { build_cost: 2, energy_cost: 0 }
    - value: "d10"
      label: "1d10"
      cost: { build_cost: 3, energy_cost: 0 }
    - value: "d12"
      label: "1d12"
      cost: { build_cost: 4, energy_cost: 0 }
    - value: "d12+1"
      label: "1d12+1"
      cost: { build_cost: 5, energy_cost: 0 }
    - value: "d12+2"
      label: "1d12+2"
      cost: { build_cost: 6, energy_cost: 0 }
    - value: "d12+3"
      label: "1d12+3"
      cost: { build_cost: 7, energy_cost: 0 }

  # Balanced per-knockout costs for Phase perks. A knockout is a condition
  # that interrupts an active Phase, so it is a drawback: the more easily a
  # knockout can be triggered, the larger the build discount it grants. "None"
  # (no way to interrupt) is a benefit and therefore costs build points.
  knockout_options:
    - value: "None"
      cost: { build_cost: 2 }
    - value: "Engager takes damage"
      cost: { build_cost: -1 }
    - value: "Engager falls unconscious"
      cost: { build_cost: 0 }
    - value: "Engager dies"
      cost: { build_cost: 0 }
    - value: "Engager gets grabbed or restrained"
      cost: { build_cost: 0 }
    - value: "Engager moves voluntarily"
      cost: { build_cost: -1 }
    - value: "Engager is moved by another effect"
      cost: { build_cost: 0 }
    - value: "Engager fails a validation"
      cost: { build_cost: -1 }
    - value: "Engager uses another phase"
      cost: { build_cost: 0 }
    - value: "Engager loses line of sight to target"
      cost: { build_cost: 0 }
    - value: "Target moves out of range"
      cost: { build_cost: 0 }
    - value: "Target falls unconscious"
      cost: { build_cost: 0 }
    - value: "Target dies"
      cost: { build_cost: 0 }
    - value: "Target succeeds on a counter roll"
      cost: { build_cost: -1 }
    - value: "Phase duration expires"
      cost: { build_cost: 0 }
    - value: "Engager runs out of energy"
      cost: { build_cost: 0 }

  # How the per-round upkeep of a Concentration perk is paid.
  concentration_upkeep:
    - value: "1 Action or 1 Energy"
      cost: { build_cost: 0, energy_cost: 0 }
    - value: "1 Action"
      cost: { build_cost: 1, energy_cost: 0 }
    - value: "1 Energy"
      cost: { build_cost: 2, energy_cost: 0 }
    - value: "Effortless (no upkeep cost)"
      cost: { build_cost: 4, energy_cost: 0 }

  directions:
    - Towards
    - Away

  roll_medicine:
    - value: "medicine"
      label: "Medicine"
      cost: { build_cost: 0, energy_cost: 0 }

  # What sets a Reaction off. Every trigger is written target-neutral
  # ("someone") so a reaction never cares whether the creature involved is an
  # ally or an enemy; the enactments decide who is actually affected.
  #
  # Cost is extra build cost on top of the reaction perk type's base_cost,
  # priced purely on how often the trigger realistically fires:
  #   0 - genuinely conditional, fires on a subset of events
  #   1 - frequent, comes up most rounds
  #   2 - near-unconditional, effectively fires whenever you want it to
  #
  # Add, remove, reword or reprice entries freely: the builder dropdown, the
  # generated perk instructions and the rulebook all read this list. The value
  # is the stored id, so renaming a label never invalidates a saved reaction.
  reaction_triggers:
    - value: attack_hits
      label: "An attack against someone within range hits"
      information: "Resolved after the attack roll lands, so you already know it hit."
      cost: { build_cost: 0 }
    - value: attack_misses
      label: "An attack against someone within range misses"
      information: "The riposte trigger: the attack resolved and failed."
      cost: { build_cost: 0 }
    - value: moves_out_of_reach
      label: "Someone leaves your reach"
      information: "The attack-of-opportunity trigger. Bounded by your own reach rather than the trigger range."
      cost: { build_cost: 0 }
    - value: someone_drops
      label: "Someone within range is reduced to 0 HP"
      information: "Rare and dramatic, so it is priced as a conditional trigger."
      cost: { build_cost: 0 }
    - value: moves_into_range
      label: "Someone enters your range"
      information: "Zone control. Fires often in a fight where anyone is moving."
      cost: { build_cost: 1 }
    - value: crit_or_crit_fail
      label: "Someone within range critically succeeds or critically fails"
      information: "Either end of the dice ladder, so it comes up regularly across a table of rolls."
      cost: { build_cost: 1 }
    - value: attacked
      label: "Someone within range is attacked"
      information: "Fires on every attack regardless of outcome, which makes it the broadest trigger here."
      cost: { build_cost: 2 }
    - value: damage_taken
      label: "Someone within range takes damage"
      information: "Near-unconditional in any real fight."
      cost: { build_cost: 2 }
    - value: uses_perk
      label: "Someone within range uses a perk"
      information: "The counterspell trigger. Near-unconditional once more than one creature is acting."
      cost: { build_cost: 2 }


# Config-defined grouped dropdown sources. Each names an ordered set of member
# groups, replacing the previously hardcoded skills_all/roll_all grouping.
option_groups:
  # All skill categories, grouped by category. Skill cost comes from a field's
  # group_offsets keyed on the category id (general/offense/defense).
  conditions_all:
    groups:
      - source: conditions
        label: "Conditions"

  roll_damage:
    groups:
      - source: skills.offense
        label: "Offense"
      - source: roll_generic
        label: "Generic"
      - source: skills.general
        label: "General"

  roll_heal:
    groups:
      - source: roll_generic
        label: "Generic"
      - source: roll_medicine
        label: "Medicine"

  skills_generic_offense:
    groups:
      - source: roll_generic
        label: "Generic"
      - source: skills.offense
        label: "Defense"

  skills_general_defense:
    groups:
      - source: skills.general
        label: "General"
      - source: skills.defense
        label: "Defense"

  skills_all:
    groups:
      - source: skills.general
        label: "General"
      - source: skills.offense
        label: "Offense"
      - source: skills.defense
        label: "Defense"
  # A "Generic" group of costed dice followed by the skill categories. Dice
  # carry no namespace (so bare defaults like d6 keep matching); skills are
  # namespaced by category so group_offsets apply.
  roll_all:
    groups:
      - source: roll_generic
        label: "Generic"
      - source: skills.general
        label: "General"
      - source: skills.offense
        label: "Offense"
      - source: skills.defense
        label: "Defense"

validations:
  information: "What rolls are needed?"
  render_information: false
  fields:
    - key: engage
      label: "Engage"
      type: dropdown
      default: d6
      options_source: roll_all
      group_offsets:
        default_group: offense
        offsets:
          offense: { build_cost: 0 }
          general: { build_cost: 1 }
          defense: { build_cost: 2 }
    - key: counter_skill
      label: "Counter Skill"
      type: multiselect
      default_count: 2
      options_source: skills_all
      row_defaults:
        - value: "defense.Reflex"
        - value: "defense.Constitution"
      row_fields:
        - key: value
          label: "Counter Skill"
          type: dropdown
          options_source: skills_all
          # A counter roll is expected to use a Defensive skill. Choosing a
          # skill from any other category costs extra build points.
          group_offsets:
            default_group: defense
            offsets:
              defense: { build_cost: 0 }
              offense: { build_cost: 2 }
              general: { build_cost: 1 }
      per_item:
        increase: { build_cost: 1 }
        decrease: { build_cost: -1 }
