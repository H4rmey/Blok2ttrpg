# Invoking: the invoke point economy.
#
# Invoke points are a per-player, per-session currency. They are not a build
# budget like skill or perk points: nothing on the character sheet is paid
# for with them. They are spent in play to bend a scene, and earned back by
# letting the fiction bite.
#
# The size of the pool per level lives in leveling.yaml (leveling.invoke_points);
# this file defines what a point buys, how one is earned, and the limits on
# reactions. Every number below is a rules parameter surfaced in the generated
# documentation, so the rulebook and the app can never disagree.
invoking:
  # When the pool returns to its maximum. The app does not track sessions, so
  # this is a instruction to the table rather than something the engine
  # enforces; it is rendered into the rulebook verbatim.
  refresh: "the start of every session or scenario"

  # Whether points earned in play may push the pool above its per-level
  # maximum. False keeps the maximum meaningful: a player sitting on a full
  # pool must spend before they can bank more, which pushes them to actually
  # use the currency instead of hoarding it.
  allow_over_maximum: false

  # How often a character may act out of turn at all. This is deliberately its
  # own block rather than part of invoke_actions, because it is the one rule the
  # two routes genuinely share.
  reaction_limit:
    max_per_round: 1
    # Whether max_per_round counts invoke actions and Reaction perks against the
    # same limit. True means owning three Reaction perks does not let you act
    # out of turn three times in a round, which is what keeps a reaction-heavy
    # build from dominating the round order.
    shared: true
    # What a Reaction perk costs in invoke points to fire. Zero, because the
    # invoke point was effectively pre-paid with the perk point spent to build
    # it. Raise it if built reactions prove too cheap.
    perk_invoke_cost: 0
