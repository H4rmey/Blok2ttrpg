# Invoking: the invoke point economy.
#
# Invoke points are a per-player, per-session currency. They are not a build
# budget like skill or perk points: nothing on the character sheet is paid
# for with them. They are spent in play to bend a scene, and earned back by
# letting the fiction bite.
#
# The size of the pool per level lives in leveling.yaml (leveling.invoke_points);
# this file defines what a point buys, how one is earned, and the limits on
# reactions. Every number below is a rules parameter surfaced in the generated
# documentation, so the rulebook and the app can never disagree.
invoking:
  # When the pool returns to its maximum. The app does not track sessions, so
  # this is a instruction to the table rather than something the engine
  # enforces; it is rendered into the rulebook verbatim.
  refresh: "the start of every session or scenario"

  # Whether points earned in play may push the pool above its per-level
  # maximum. False keeps the maximum meaningful: a player sitting on a full
  # pool must spend before they can bank more, which pushes them to actually
  # use the currency instead of hoarding it.
  allow_over_maximum: false

  # What a point buys. Each entry is one way to spend, with its cost in invoke
  # points and (where relevant) energy.
  spends:
    - id: invoke_trait
      name: "Invoke a trait"
      invoke_cost: 1
      energy_cost: 0
      description: >-
        Bring one of your traits to bear on a roll or a scene. The trait must
        plausibly apply. The usual effect is a one-step bonus on the dice
        ladder, but the GM may instead grant a fact, an opening, or an
        advantage that follows from the trait.
    - id: invoke_action
      name: "Take an invoke action"
      invoke_cost: 1
      energy_cost: 1
      description: >-
        Act out of turn in combat, improvised on the spot. This is not a
        Reaction perk: nothing is written on your sheet in advance. See the
        invoke_actions and reaction_limit blocks below for timing and frequency.
    - id: reroll_argument
      name: "Reroll a negotiation argument"
      invoke_cost: 1
      energy_cost: 0
      description: >-
        Reroll a failed argument during a negotiation, no questions asked. The
        argument still costs the NPC's patience either way.

  # How a point is earned. Negative invocation is the backbone: the currency is
  # generated by accepting that a trait cuts both ways.
  gains:
    - id: negative_invoke_self
      name: "Invoke a trait against yourself"
      points: 1
      description: >-
        Volunteer one of your own traits as a complication and accept the
        penalty or the consequence that follows. Available in and out of combat.
    - id: negative_invoke_gm
      name: "Accept a GM invocation"
      points: 1
      description: >-
        The GM invokes one of your traits against you. You may always accept it
        for a point. Declining is a conversation, not a mechanic: if you and the
        GM cannot agree the trait applies, it does not.

  # Extra ways a point is earned specifically in combat, where negative
  # invocation alone can dry up during a long fight. Each entry may cap itself
  # with once_per_combat; the whole block is capped by max_per_combat so a fight
  # can never become an invoke point faucet.
  #
  # Remove or add entries freely: the rulebook renders whatever is listed here.
  combat_gains:
    max_per_combat: 3
    triggers:
      - id: critical_failure
        name: "Critical failure"
        points: 1
        once_per_combat: false
        description: >-
          Roll the lowest possible result on an engagement roll. Bad luck
          becomes fuel rather than only a setback.
      - id: refuse_mitigation
        name: "Take a hit you could have avoided"
        points: 1
        once_per_combat: false
        description: >-
          Decline a reaction or mitigation you were able to use, and take the
          consequence in full.
      - id: round_cadence
        name: "Every third round"
        points: 1
        once_per_combat: false
        # Granted at the start of every Nth round of a combat.
        every_rounds: 3
        description: >-
          A slow trickle so a drawn-out fight does not leave everyone empty.

  # The improvised out-of-turn action, bought in play with an invoke point.
  #
  # This used to be called a "freeform reaction", which collided with the
  # Reaction perk type built in the perk builder. Two different things sharing
  # one name made every rules sentence about either of them ambiguous, so the
  # improvised kind is now an "invoke action" and the word "reaction" refers
  # only to the perk type.
  invoke_actions:
    name: "Invoke Action"
    invoke_cost: 1
    energy_cost: 1
    # When an invoke action may interrupt. "between_actions" means it resolves
    # before or after a whole action, never in the middle of one, so it cannot
    # be used to undo a roll that has already happened.
    timing: "between_actions"
    description: >-
      An action taken out of turn, improvised on the spot. Describe what you do,
      pay the invoke point and the energy, and the GM resolves it like any other
      action. Nothing is written on your sheet in advance.

  # How often a character may act out of turn at all. This is deliberately its
  # own block rather than part of invoke_actions, because it is the one rule the
  # two routes genuinely share.
  reaction_limit:
    max_per_round: 1
    # Whether max_per_round counts invoke actions and Reaction perks against the
    # same limit. True means owning three Reaction perks does not let you act
    # out of turn three times in a round, which is what keeps a reaction-heavy
    # build from dominating the round order.
    shared: true
    # What a Reaction perk costs in invoke points to fire. Zero, because the
    # invoke point was effectively pre-paid with the perk point spent to build
    # it. Raise it if built reactions prove too cheap.
    perk_invoke_cost: 0
