additional_condition:
  build_cost: 1
  energy_cost: 0

# Config-defined grouped dropdown sources for conditions. Both wrap the single
# unified conditions list in one labelled optgroup. Options use bare condition
# ids (no namespace), which the cost engine resolves via ConditionByID:
# shiftable conditions charge per-shift, fixed conditions charge build/energy.
# "conditions_all" backs the Enact Condition selector.

option_groups:
  conditions_all:
    groups:
      - source: conditions
        label: "Conditions"


# Pricing tiers used throughout this file, so a new condition can be slotted in
# by comparing it to its neighbours:
#
#   1  minor friction: a single small penalty, easily played around
#   2  a real restriction: removes one option or shifts one die
#   3  a strong restriction: removes a whole category of play
#   4  removes a turn's worth of agency, or hands control to someone else
#   5  near-total denial for a round
#   6+ effectively removes a character from the fight
#
# Buffs are priced one step above the mirrored debuff: making an ally stronger
# is worth more than making one enemy weaker, because the ally acts every round.
#
# A condition may also set "selectable: false". Such a condition is a state the
# rules impose (Dying), a property of gear, or a GM-only effect: it is never
# offered in the Enact Condition dropdown, but it keeps its id, name and
# description so existing perks and the rules reference still resolve it.

conditions:
  # Shiftable conditions. IMPORTANT: a condition that declares a shift range is
  # charged shift_cost PER UNIT OF SHIFT and its build_cost is never read. These
  # four previously set only build_cost, which made them free at any magnitude.
  - id: blinded
    name: "Blinded"
    description: "Reduces certain trait rolls"
    min_shift: -6
    max_shift: 0
    shift_cost: { build_cost: 1 }
  - id: encumbered
    name: "Encumbered"
    description: "Reduces movement and relevant traits"
    min_shift: -6
    max_shift: 0
    shift_cost: { build_cost: 1 }
  - id: encouraged
    name: "Encouraged"
    description: "Positive trait shifts"
    min_shift: 1
    max_shift: 6
    # A buff costs more per step than the mirrored debuff (see Frightened).
    shift_cost: { build_cost: 2 }
  - id: frightened
    name: "Frightened"
    description: "Negative trait shifts"
    min_shift: -6
    max_shift: 0
    shift_cost: { build_cost: 1 }
  - id: taunted
    name: "Taunted"
    description: "You can only target a preset Target."
    # Removes every targeting option but one, which is the same weight as
    # Confused (2) and Isolated (2). Was 1, the "minor friction" tier.
    build_cost: 2
  - id: swayed
    name: "Swayed"
    description: "You cannot target a preset Target anymore."
    # Removes one targeting option: the mirror of Taunted, priced with it.
    build_cost: 2
  - id: untargetable
    name: "Untouchable"
    description: "You cannot be targeted."
    # Near-total denial of incoming attacks for the duration, so tier 5. At 4 it
    # was priced level with Charmed while being harder to play around.
    build_cost: 5
  - id: ignored
    name: "Ignored"
    description: "You cannot be targeted, but you can still get hit."
    # A weaker Untouchable (5): you avoid being singled out but area effects and
    # stray hits still reach you, so it sits one step below it.
    build_cost: 3
  - id: confused
    name: "Confused"
    description: "You indiscriminately target anyone."
    build_cost: 2
  - id: vengeful
    name: "Vengeful"
    description: "You can only target the last entity that dealt damage to you."
    build_cost: 2
  - id: distracted
    name: "Distracted"
    description: "If you change your current target to a new one, your rolls will shift one down for that new target."
    build_cost: 1
  - id: isolated
    name: "Isolated"
    description: "You cannot target, heal, or buff your allies; you can only interact with yourself or your direct opponent."
    build_cost: 2


  # Mind Control & Behavioral Constraints
  - id: charmed
    name: "Charmed"
    description: "You must do what the Charmer says."
    # Hands full control of a character to someone else, which is the strongest
    # thing short of denial. Was 4, the same as "phase through walls".
    build_cost: 5
  - id: hypnotized
    name: "Hypnotized"
    description: "You mimic the exact movement and action of the person who hypnotized you on their last turn."
    # Also surrenders control of the whole turn, so priced with Charmed.
    build_cost: 5
  - id: stubborn
    name: "Stubborn"
    description: "You cannot repeat the same action or use the same ability two turns in a row."
    build_cost: 2
  - id: paranoid
    name: "Paranoid"
    description: "You refuse help from anyone."
    build_cost: 2
  - id: insane
    name: "Insane"
    description: "At the start of your turn, roll a die (d4) to determine random behavior."
    build_cost: 3

  # Action & Ability Inhibitors
  - id: stunned
    name: "Stunned"
    description: "You are stunned; you lose one of your actions."
    # One of three actions, so a third of a turn.
    build_cost: 3
  - id: paralyzed
    name: "Paralyzed"
    description: "Lose your turn."
    # Strictly worse than Stunned, so it must cost more: the whole turn rather
    # than one action. Both sat at 4.
    build_cost: 5
  - id: pacified
    name: "Pacified"
    description: "You can no longer attack any Target."
    build_cost: 3
  - id: enraged
    name: "Enraged"
    description: "You can no longer use weapons."
    build_cost: 3
  - id: disarmed
    name: "Disarmed"
    description: "You no longer have a weapon."
    build_cost: 2
  - id: silenced
    name: "Silenced"
    description: "You can no longer talk."
    build_cost: 2
  - id: deafened
    name: "Deafened"
    description: "You can no longer listen."
    build_cost: 2
  - id: stifled
    name: "Stifled"
    description: "Your hands are bound; you cannot use items, potions, or consumables from your inventory."
    build_cost: 2
  - id: staggered
    name: "Staggered"
    description: "You can no longer use Reactions or your Preparation is cancelled."
    build_cost: 2

  # Movement & Positioning
  - id: prone
    name: "Prone"
    description: "You are knocked on the ground; use one of your actions to get up."
    build_cost: 2
  - id: anchored
    name: "Anchored"
    description: "You can no longer move."
    build_cost: 2
  - id: restrained
    name: "Restrained"
    description: "You can no longer use your hands."
    build_cost: 2
  - id: slowed
    name: "Slowed"
    description: "Movement speed shifted one down."
    # One die shift on a trait, which is the tier 2 "shifts one die" line. Was 1.
    build_cost: 2
  - id: terrified
    name: "Terrified"
    description: "You move 1m away from the target (or take 1d4 damage)."
    # A 1m push or 1d4 is friction, not a lost category of play. Was 3.
    build_cost: 2

  # Dice & Stats Modifications
  - id: weakened
    name: "Weakened"
    description: "Damaging rolls are shifted one die down."
    build_cost: 2
  - id: fragile
    name: "Fragile"
    description: "Engager that targets you, may shift their damage die by +1."
    build_cost: 2
  - id: cursed
    name: "Cursed"
    description: "Die shifts up are converted to die shifts down."
    build_cost: 2
  - id: blessed
    name: "Blessed"
    description: "Die shifts down are converted to die shifts up."
    build_cost: 3
  - id: hesitant
    name: "Hesitant"
    description: "Your Engagement Roll must be rolled twice."
    # Rerolling every engagement is a standing penalty on each attack, which is
    # heavier than the single small penalties on tier 1. Was 1.
    build_cost: 2
  - id: broken_gear
    name: "Broken Gear"
    description: "Rolls for this gear are reduced by one die shift."
    # A property of a piece of equipment, applied by wear, sundering or the GM,
    # not an effect a perk buys, so it is not offered in the dropdown.
    selectable: false
    build_cost: 2
  - id: amplified_gear
    name: "Amplified Gear"
    description: "Rolls for this gear are upgraded by one die shift."
    # Gear state like Broken Gear: granted by the item, not purchased.
    selectable: false
    build_cost: 3

  # Energy & Resource Manipulation
  - id: fatigued
    name: "Fatigued"
    description: "Energy cost of abilities is increased by 1."
    build_cost: 2
  - id: energized
    name: "Energized"
    description: "Energy cost of abilities is reduced by 1."
    # A buff, so one step above Fatigued. Now that a perk costs 1 energy per
    # enactment, this is a standing discount on every perk the target uses.
    build_cost: 3

  # Time & Round Economy
  - id: delayed
    name: "Delayed"
    description: "You move down one in the turn order."
    build_cost: 2
  - id: hastened
    name: "Hastened"
    description: "You move up one in the turn order."
    build_cost: 2
  - id: echoed
    name: "Echoed"
    description: "Whatever action you took last round will be executed automatically next round."
    # Repeats an action the target already chose, so it neither removes agency
    # nor hands over control: a strong restriction, not a tier 4. Was 4.
    build_cost: 3

  # Health, Death & Reality Alterations
  - id: dying
    name: "Dying"
    description: "Your HP went below 0; you are out of combat until revived by an ally."
    # A consequence of running out of HP, which the rules apply on their own. It
    # is listed here so the rules reference and existing perks can name it, but
    # it must never be purchasable, hence cost 0 and selectable: false.
    selectable: false
    build_cost: 0
  - id: doomed
    name: "Doomed"
    description: "You will move to Dying in x turns."
    build_cost: 3
  - id: zombified
    name: "Zombified"
    description: "Healing damages instead; Damage heals instead."
    build_cost: 3
  - id: linked
    name: "Linked"
    description: "You are linked to a Target; what happens to you happens to the linked Target. This links per Trait."
    build_cost: 3
  - id: incorporeal
    name: "Incorporeal"
    description: "Phase through walls."
    # Positioning utility with no combat denial attached, so tier 3 rather than
    # the tier 4 it shared with Charmed.
    build_cost: 3
  - id: marked
    name: "Marked"
    description: "Everything that happens to you is buffed or nerfed (pick one)."
    build_cost: 3
  - id: invincible
    name: "Invincible"
    description: "You cannot be damaged."
    # Total damage immunity: the strongest effect in the game and a narrative /
    # GM tool rather than a perk, so it is not selectable. The cost is kept at
    # the top of the scale for reference.
    selectable: false
    build_cost: 8
