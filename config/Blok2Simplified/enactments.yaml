enactments:
  information: "What is this going to do?"
  render_information: false
  condition:
    type: "Enact Condition"
    information: "Enact Condition will apply a condition to a target (e.g., prone, stunned, charmed). A Condition will always have a value."
    render_information: false
    base_cost:
      build_cost: 1
      energy_cost: 0
    fields:
      - key: condition
        label: "Condition"
        type: dropdown
        options_source: conditions_all
        shift_key: shift_amount
      - key: duration
        label: "Duration (turns)"
        type: dropdown
        default: "1"
        options:
          - value: "1"
            label: "1 turn"
          - value: "2"
            label: "2 turns"
            cost: { build_cost: 1 }
          - value: "3"
            label: "3 turns"
            cost: { build_cost: 2 }
          - value: "4"
            label: "4 turns"
            cost: { build_cost: 3 }
          - value: "5"
            label: "5 turns"
            cost: { build_cost: 4 }
          - value: "6"
            label: "6 turns"
            cost: { build_cost: 5 }
          - value: "unlimited"
            label: "Unlimited"
            cost: { build_cost: 8, energy_cost: 0 }
      - key: solution_1
        label: "Solution 1"
        type: dropdown
        options_source: skills_general_defense
        group_offsets:
          default_group: defense
          offsets:
            general: { build_cost: 0 }
      - key: solution_2
        label: "Solution 2"
        type: dropdown
        options_source: skills_general_defense
        group_offsets:
          default_group: defense
          offsets:
            general: { build_cost: 0 }
      - key: solution_dc
        label: "Solution DC"
        type: free_number
        default: 2
        min: 2
        max: 12
        step: 1
        per_step:
          increase: { build_cost: 1 }
          decrease: { build_cost: -1 }

  damage:
    type: "Enact Damage"
    information: "Enact Damage allows characters to inflict harm on their enemies. It always has a Source Die and can have added bonuses."
    render_information: false
    base_cost:
      build_cost: 1
      energy_cost: 0
    fields:
      - key: source
        label: "Damage Source"
        type: dropdown
        options_source: roll_damage
        information: "The offensive skill whose die is rolled for damage."
        group_offsets:
          default_group: roll_generic
          offsets:
            general: { build_cost: 2 }
            offense: { build_cost: 1 }


  effect:
    type: "Enact Effect"
    information: "The Enact Effect applies a lingering effect to a target, such as fire, frost, or poison damage. By default, the effect lasts for a few rounds and triggers at the start of the target's turn. On the target's turn they can re-roll the solution to get rid of the effect or take an action to remove it."
    render_information: false
    base_cost:
      build_cost: 2
      energy_cost: 0
    fields:
      - key: effect_type
        label: "Applies"
        type: dropdown
        options:
          - value: damage
            label: "Damage"
          - value: healing
            label: "Healing"
          - value: motion
            label: "Motion"
        inline_builder:
          kind: enactment
      - key: effect-duration
        label: "Duration (rounds)"
        type: free_number
        default: 1
        min: 1
        max: 5
        step: 1
        per_step:
          increase: { build_cost: 1 }
          decrease: { build_cost: -1 }
      - key: solution_1
        label: "Solution 1"
        type: dropdown
        options_source: skills_general_defense
        group_offsets:
          default_group: defense
          offsets:
            general: { build_cost: 0 }
      - key: solution_2
        label: "Solution 2"
        type: dropdown
        options_source: skills_general_defense
        group_offsets:
          default_group: defense
          offsets:
            general: { build_cost: 0 }
      - key: solution_dc
        label: "Solution DC"
        type: free_number
        default: 2
        min: 2
        max: 12
        step: 1
        per_step:
          increase: { build_cost: 1 }
          decrease: { build_cost: -1 }

  healing:
    type: "Enact Healing"
    information: "Enact Healing perks allow characters to restore health to themselves or others. It always has a Source Die and may contain other bonuses."
    render_information: false
    base_cost:
      build_cost: 1
      energy_cost: 0
    fields:
      - key: source
        label: "Healing Source"
        type: dropdown
        default: d4
        options_source: roll_heal
        group_offsets:
          default_group: roll_generic
          offsets:
            defense: { build_cost: 0 }

  motion:
    type: "Enact Motion"
    information: "Enact Motion allows you to move a Target up to a preset amount of meters."
    render_information: false
    base_cost:
      build_cost: 1
      energy_cost: 0
    fields:
      - key: distance
        label: "Distance"
        type: free_number
        default: 1
        min: 1
        max: 20
        step: 1
        per_step:
          increase: { build_cost: 1 }
          decrease: { build_cost: -1 }
      - key: direction
        label: "Directions"
        type: multiselect
        default_count: 1
        row_fields:
          - key: value
            label: "Direction"
            type: dropdown
            options_source: directions
        per_item:
          increase: { build_cost: 0 }


  phase:
    name: "Enact Phase"
    information: "Enact Phase allows you to shift some skills now and then reverse the effects later. It always lasts for a preset amount of turns. So if you shift a skill up for 2 rounds, after those two rounds those skills are shifted down for 2 rounds."
    render_information: false
    base_cost: 
      build_cost: 2
      energy_cost: 0
    fields:
      - key: phase-duration
        label: "Duration (rounds)"
        type: free_number
        default: 1
        min: 1
        max: 5
        step: 1
        per_step:
          increase: { build_cost: 1 }
          decrease: { build_cost: -1 }
      - key: phase-shift-amount
        label: "Shift -/+"
        type: free_number
        default: 0
        min: -6
        max: 6
        step: 1
        per_step:
          increase: { build_cost: 1 }
          decrease: { build_cost: 1 }
      - key: shift-affected-skills
        label: "Affected Skill(s)"
        type: multiselect
        default_count: 1
        options_source: skills_all
        row_defaults:
          - value: "offense.precision"
          - value: "offense.power"
        row_fields:
          - key: value
            label: "Affected Skill"
            type: dropdown
            options_source: skills_all
            group_offsets:
              default_group: defense
              offsets:
                defense: { build_cost: 0 }
                offense: { build_cost: 0 }
                general: { build_cost: 0 }
        per_item:
          increase: { build_cost: 1 }
          decrease: { build_cost: -1 }

  shift:
    type: "Enact Shift"
    information: "Enact Shift allows you to temporarily enhance or weaken Skills. They always have a shift value ranging from -6 to 6, which decides how much and in what direction the shift happens."
    render_information: false
    base_cost:
      build_cost: 2
      energy_cost: 0
    fields:
      - key: shift-skills
        label: "Skill"
        type: dropdown
        options_source: skills_complete
      - key: shift-amount
        label: "Shift -/+"
        type: free_number
        default: 0
        min: -6
        max: 6
        step: 1
        per_step:
          increase: { build_cost: 1 }
          decrease: { build_cost: 1 }
      - key: shift-duration
        label: "Duration"
        type: free_number
        default: 1
        min: 1
        max: 5
        step: 1
        per_step:
          increase: { build_cost: 1 }
          decrease: { build_cost: -1 }

  adjustment:
    type: "Enact Adjustment"
    information: "Enact Adjustment allows you to adjust the effect of another enactment that someone or you is affected by. The supported enactments are Damage, Healing and Motion, the adjustment applies to the Source component and is added to it"
    render_information: false
    base_cost:
      build_cost: 2
      energy_cost: 0
    fields:
      - key: source
        label: "Source"
        type: dropdown
        options_source: roll_generic
        information: "The offensive skill whose die is rolled for damage. Higher proficiency in the skill means a larger die."
    

  resource:
    type: "Enact Resource"
    information: "Generate a named resource or consume stored resources to execute another enactment. Resources with the same name are linked. Note that if you have a Consume type of resource, you must have it available to use this option, so it relies on getting the resource (by for example: Enact Resource --> Generate)"
    render_information: false

    base_cost:
      build_cost: 1
      energy_cost: 0

    fields:
      - key: resource_mode
        label: "Mode"
        type: dropdown
        default: generate
        options:
          - value: generate
            label: "Generate"
            information: "Generate resources when this enactment resolves successfully."

          - value: consume
            label: "Consume"
            information: "Consume stored resources to execute another enactment."

      - key: resource_name
        label: "Resource Name"
        type: free_text
        information: "The name linking resource generation and consumption, such as Blood, Origami Bird, Rage, or Charge."
        render_information: false

      # Generate fields

      - key: generate_amount
        label: "Amount Generated"
        type: free_number
        default: 1
        min: 1
        max: 10
        step: 1
        visibility_when: resource_mode
        show_when: generate
        per_step:
          increase: { build_cost: 1 }
          decrease: { build_cost: -1 }

      - key: consumed_effect
        label: "Effect Per Consumed Resource"
        type: dropdown
        visibility_when: resource_mode
        show_when: consume
        information: "The selected enactment is executed once for every consumed resource."
        options:
          - value: damage
            label: "Damage"

          - value: healing
            label: "Healing"

          - value: motion
            label: "Motion"

          - value: condition
            label: "Condition"

          - value: shift
            label: "Shift"

          - value: adjustment
            label: "Adjustment"

          - value: phase
            label: "Phase"

        inline_builder:
          kind: enactment
