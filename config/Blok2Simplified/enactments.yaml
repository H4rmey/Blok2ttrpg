enactments:
  amplification:
    name: "Enact Amplification"
    description: "Enact Amplification allows you to increase the effect of an enactment you or someone else are the target for. It always has a Amplification Die which determines the amplification of the effect."
    base_energy: 3
    base_action: 2
    fields:
      - key: comment
        label: "Comment"
        type: free_text
      - key: source
        label: "Amplification"
        type: dropdown
        default: d4
        options_source: roll_all
        group_offsets:
          default_group: offense
          offsets:
            generic:
              build_cost: 3
            offense:
              build_cost: 2
            general:
              build_cost: 3
            defense:
              build_cost: 4
      - key: flat
        label: "Flat Bonus"
        type: free_number
        default: 0
        min: 0
        max: 20
        step: 1
        per_step:
          increase:
            build_cost: 2
            energy_cost: 0
          decrease:
            build_cost: 0
            energy_cost: 0
  phase:
    name: "Enact Phase"
    description: "Enter a Phase, on phase end, the effect reverses"
    base_energy: 3
    base_action: 2
    base_duration: 2
    base_reverse_duration: 2
    fields:
      - key: comment
        label: "Comment"
        type: free_text
      - key: phase-duration
        label: "Duration (rounds)"
        type: free_number
        default: 1
        min: 1
        max: 5
        step: 1
        per_step:
          increase:
            build_cost: 0
            energy_cost: 0
          decrease:
            build_cost: 1
            energy_cost: 4
      - key: shift_amount
        label: "Shift -/+"
        type: free_number
        default: 0
        min: -6
        max: 6
        step: 1
        per_step:
          increase:
            build_cost: 3
            energy_cost: 1
          decrease:
            build_cost: 3
            energy_cost: 1
      - key: affected_traits
        label: "Affected Trait(s)"
        type: solutions
        default_count: 2
        options_source: traits_all
        row_defaults:
          - value: "offense.precision"
          - value: "offense.power"
        row_fields:
          - key: value
            label: "Affected Trait"
            type: dropdown
            options_source: traits_all
            group_offsets:
              default_group: defense
              offsets:
                defense:
                  build_cost: 2
                offense:
                  build_cost: 2
                general:
                  build_cost: 2
        per_item:
          increase:
            build_cost: 1
            energy_cost: 1
          decrease:
            build_cost: 0
            energy_cost: 0

  negation:
    type: "Enact  Negation"
    description: "Nullify an ability completely"
    base_cost:
      build_cost: 4
      energy_cost: 2
    fields:
      - key: comment
        label: "Comment"
        type: free_text
      - key: full_counter
        label: "Ability hits Engager instead"
        type: checkbox
        cost:
          build_cost: 4
          energy_cost: 2
  mitigation:
    type: "Enact  Mitigation"
    description: "Reduce the effect of an incomming ability"
    base_cost:
      build_cost: 2
      energy_cost: 1
    fields:
      - key: comment
        label: "Comment"
        type: free_text
      - key: source
        label: "Source"
        type: dropdown
        default: d6
        options_source: roll_all
        group_offsets:
          default_group: offense
          offsets:
            offense:
              build_cost: 3
            general:
              build_cost: 3
            defense:
              build_cost: 3
      - key: flat
        label: "Flat Bonus"
        type: free_number
        default: 0
        min: 0
        max: 20
        step: 1
        per_step:
          increase:
            build_cost: 2
            energy_cost: 0
          decrease:
            build_cost: 0
            energy_cost: 0

  damage:
    type: "Enact Damage"
    description: "Inflicts damage to a target."
    base_cost:
      build_cost: 2
      energy_cost: 1
    fields:
      - key: comment
        label: "Comment"
        type: free_text
      - key: source
        label: "Source"
        type: dropdown
        default: d6
        options_source: roll_all
        group_offsets:
          default_group: offense
          offsets:
            offense:
              build_cost: 3
            general:
              build_cost: 3
            defense:
              build_cost: 3
      - key: flat
        label: "Flat Bonus"
        type: free_number
        default: 0
        min: 0
        max: 20
        step: 1
        per_step:
          increase:
            build_cost: 2
            energy_cost: 0
      - key: damage_type
        label: "Damage Types"
        type: solutions
        default_count: 1
        options_source: damage_types
        row_fields:
          - key: value
            label: "Damage Type"
            type: dropdown
            options_source: damage_types
        per_item:
          increase:
            build_cost: 2
            energy_cost: 0
          decrease:
            build_cost: 0
            energy_cost: 0

  healing:
    type: "Enact Healing"
    description: "Restores health to a target."
    base_cost:
      build_cost: 2
      energy_cost: 1
    fields:
      - key: comment
        label: "Comment"
        type: free_text
      - key: source
        label: "Source"
        type: dropdown
        default: d6
        options_source: roll_all
        group_offsets:
          default_group: offense
          offsets:
            offense:
              build_cost: 3
            general:
              build_cost: 3
            defense:
              build_cost: 3
      - key: flat
        label: "Flat Bonus"
        type: free_number
        default: 0
        min: 0
        max: 20
        step: 1
        per_step:
          increase:
            build_cost: 2
            energy_cost: 0

  movement:
    type: "Enact Movement"
    description: "Moves a target or the Ability user."
    base_cost:
      build_cost: 1
      energy_cost: 0
    fields:
      - key: comment
        label: "Comment"
        type: free_text
      - key: distance
        label: "Distance"
        type: free_number
        default: 1
        min: 1
        max: 20
        step: 1
        per_step:
          increase:
            build_cost: 1
            energy_cost: 0
      - key: direction
        label: "Directions"
        type: solutions
        default_count: 1
        options_source: directions_simple
        row_fields:
          - key: value
            label: "Direction"
            type: dropdown
            options_source: directions_simple
        per_item:
          increase:
            build_cost: 0
            energy_cost: 0
          decrease:
            build_cost: 0
            energy_cost: 0

  proficiency_shift:
    type: "Enact Proficiency Shift"
    description: "Temporarily enhances or weakens Traits."
    base_cost:
      build_cost: 2
      energy_cost: 1
    fields:
      - key: comment
        label: "Comment"
        type: free_text
      - key: shifted_trait
        label: "Trait"
        type: dropdown
        options_source: traits_all
      - key: shift_amount
        label: "Shift -/+"
        type: free_number
        default: 0
        min: -6
        max: 6
        step: 1
        per_step:
          increase:
            build_cost: 3
            energy_cost: 1
          decrease:
            build_cost: 3
            energy_cost: 1
      - key: shift_uses
        label: "Uses"
        type: free_number
        default: 1
        min: 1
        max: 5
        step: 1
        per_step:
          increase:
            build_cost: 3
            energy_cost: 1

  persistent_effect:
    type: "Enact Persistent Effect"
    description: "Applies a lingering effect that remains for multiple turns."
    base_cost:
      build_cost: 3
      energy_cost: 2
    fields:
      - key: comment
        label: "Comment"
        type: free_text
      - key: effect_name
        label: "Name"
        type: free_text
        default: "Effect"
      - key: effect_type
        label: "Applies"
        type: dropdown
        options:
          - value: damage
            label: "Damage"
          - value: healing
            label: "Heal"
          - value: movement
            label: "Move"
        inline_builder:
          kind: enactment
      - key: solution
        label: "Solutions"
        type: solutions
        default_count: 2
        options_source: traits_all
        row_defaults:
          - value: "defense.Reflex"
          - value: "defense.Constitution"
        row_fields:
          - key: value
            label: "Solution"
            type: dropdown
            options_source: traits_all
            group_offsets:
              default_group: defense
              offsets:
                defense:
                  build_cost: 0
                offense:
                  build_cost: 2
                general:
                  build_cost: 2
        per_item:
          increase:
            build_cost: 0
            energy_cost: 0
          decrease:
            build_cost: 3
            energy_cost: 1
      - key: damage_type
        label: "Damage Types"
        type: solutions
        default_count: 1
        options_source: damage_types
        row_fields:
          - key: value
            label: "Damage Type"
            type: dropdown
            options_source: damage_types
        per_item:
          increase:
            build_cost: 2
            energy_cost: 0
          decrease:
            build_cost: 0
            energy_cost: 0

  condition:
    type: "Enact Condition"
    description: "Applies a condition or condition to a target."
    base_cost:
      build_cost: 0
      energy_cost: 0
    fields:
      - key: comment
        label: "Comment"
        type: free_text
      - key: condition
        label: "Condition"
        type: state_select
        options_source: states_all
        shift_key: shift_amount
      - key: duration
        label: "Duration (turns)"
        type: dropdown
        default: "1"
        options:
          - value: "1"
            label: "1 turn"
          - value: "2"
            label: "2 turns"
            cost:
              build_cost: 1
          - value: "3"
            label: "3 turns"
            cost:
              build_cost: 2
          - value: "4"
            label: "4 turns"
            cost:
              build_cost: 3
          - value: "5"
            label: "5 turns"
            cost:
              build_cost: 4
          - value: "6"
            label: "6 turns"
            cost:
              build_cost: 5
          - value: "unlimited"
            label: "Unlimited"
            cost:
              build_cost: 15
              energy_cost: 5
      - key: solution
        label: "Solutions"
        type: solutions
        default_count: 2
        options_source: traits_all
        row_defaults:
          - value: "defense.Reflex"
          - value: "defense.Constitution"
        row_fields:
          - key: value
            label: "Solution"
            type: dropdown
            options_source: traits_all
            group_offsets:
              default_group: defense
              offsets:
                defense:
                  build_cost: 0
                offense:
                  build_cost: 2
                general:
                  build_cost: 2
        per_item:
          increase:
            build_cost: 0
            energy_cost: 0
          decrease:
            build_cost: 3
            energy_cost: 1
