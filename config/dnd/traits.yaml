# D&D ability scores mapped into the engine's trait groups. The six core
# abilities appear where they are most commonly used: offense groups the
# abilities that drive attack rolls, defense groups the abilities that drive
# saving throws, and general lists skills / utility abilities.
traits:
  general:
    - Strength
    - Dexterity
    - Constitution
    - Intelligence
    - Wisdom
    - Charisma
    - Acrobatics
    - Athletics
    - Perception
    - Stealth
    - Insight
    - Persuasion
    - Arcana
    - Medicine
    - Initiative
    - Encumbrance
  offense:
    - Strength
    - Dexterity
    - Intelligence
    - Wisdom
    - Charisma
  defense:
    - Dexterity
    - Constitution
    - Wisdom
    - Intelligence
    - Charisma
    - Strength
    - Armor Class
  vital:
    - HP
    - Movement
    - Energy
