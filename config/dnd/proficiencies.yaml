# Proficiency tiers for the D&D system. Unlike ability-builder (which scales the
# die size), every tier here rolls a flat d20 and applies a fixed modifier. The
# tier name is the modifier that is added to the d20 result: roll = d20 + tier.
# The "dice" map keeps the engine happy (it expects per-group die strings) and
# is always d20; the modifier is expressed by the tier itself.
#
# The range spans -5 to +12 so the full spread of a level 20 D&D character is
# representable: a maxed ability modifier (+5) stacked with expertise-level
# proficiency (+6) plus a little headroom for magic items and buffs.
proficiencies:
  - id: mod_minus_5
    name: "-5"
    cost: 1
    note: "d20 - 5"
    dice:
      general: "d20"
      offense: "d20"
      defense: "d20"
    vitals:
      hp: 6
      movement: 3
      energy: 4
  - id: mod_minus_4
