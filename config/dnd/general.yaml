version: 1
profile_id: dnd
title: "D&D System"
# New characters start every ability at +0 (the mod_zero tier). Tiers below +0
# (negative modifiers) are free choices; raising an ability above +0 costs
# trait points cumulatively.
default_proficiency: mod_zero

combat:
  actions:
    amount: 3
additional_enactment:
  build_cost: 1
  energy_cost: 1
  description: "Adding an additional Enactment beyond the first"
trait_categories:
  - general
  - offense
  - defense
# System 1: costed option sources. Entries in these lists each carry their own
# build/energy cost. The engine adds the selected entry's cost.
option_sources_costed:
  # Per-knockout costs for Phase-style abilities. A knockout interrupts an
  # active phase and is a drawback: easier-to-trigger knockouts grant a bigger
  # build discount. "None" is a benefit and costs build points.
  knockout_options:
    - value: "None"
      cost:
        build_cost: 3
    - value: "Engager takes damage"
      cost:
        build_cost: -1
    - value: "Engager falls unconscious"
      cost:
        build_cost: 0
    - value: "Engager dies"
      cost:
        build_cost: 1
    - value: "Engager gets grabbed or restrained"
      cost:
        build_cost: -1
    - value: "Target moves out of range"
      cost:
        build_cost: -1
    - value: "Target falls unconscious"
      cost:
        build_cost: 0
    - value: "Target dies"
      cost:
        build_cost: 0
    - value: "Concentration is broken"
      cost:
        build_cost: -1
    - value: "Phase duration expires"
      cost:
        build_cost: -2

  # Per-trigger build costs for Reaction / Preparation abilities.
  reaction_triggers:
    - value: "Target moves away from engager"
      cost:
        build_cost: 2
    - value: "Target moves towards engager"
      cost:
        build_cost: 2
    - value: "Target damages engager"
      cost:
        build_cost: 3
    - value: "Target makes a trait check"
      cost:
        build_cost: 2
    - value: "Target starts casting a spell"
      cost:
        build_cost: 4
        energy_cost: 1
    - value: "Target enters interaction range"
      cost:
        build_cost: 3
    - value: "Target leaves interaction range"
      cost:
        build_cost: 2
    - value: "Target fails a saving throw"
      cost:
        build_cost: 2
    - value: "Target succeeds on a saving throw"
      cost:
        build_cost: 2
    - value: "Engager takes damage"
      cost:
        build_cost: 3
    - value: "Ally within range takes damage"
      cost:
        build_cost: 2
    - value: "Ally within range gets healed"
      cost:
        build_cost: 1

option_sources:
  directions_all:
    - North
    - East
    - South
    - West
    - Up
    - Down
    - Any
  directions:
    - North
    - East
    - South
    - West
    - Up
    - Down
    - Any
  shift_directions:
    - UP
    - DOWN
  trigger_timings:
    - Start of Target Turn
    - End of Engager Turn
  aoe_trigger_timings:
    - Start of Target Turn
    - End of Engager Turn
  concentration_timings:
    - Start of Engager Turn
    - End of Engager Turn
  concentration_upkeep:
    - 1 Action or 1 Energy
    - 1 Action
    - 1 Energy
dice:
  damage:
    - "d4"
    - "d6"
    - "d8"
    - "d10"
    - "d12"
  generic:
    - "d20"
validations:
  fields:
    # In D&D the engagement roll is a d20 plus the relevant ability modifier.
    - key: engage_mode
      label: "Engage Roll Type"
      type: dropdown
      default: trait
      options:
        - value: trait
          label: "d20 + Ability Modifier"
        - value: generic
          label: "Flat d20"
          cost:
            build_cost: -2
            energy_cost: 0
        - value: other
          label: "Another roll result"
          cost:
            build_cost: 3
            energy_cost: 1
        - value: previous
          label: "Use result of previous interaction"
          cost:
            build_cost: 3
            energy_cost: 1
    - key: engage_trait
      label: "Ability"
      type: dropdown
      options_source: traits_all
      visibility_when: engage_mode
      show_when: trait
      # The engagement roll is expected to use an Offensive ability. Choosing an
      # ability from another category costs extra build points.
      group_offsets:
        default_group: offense
        offsets:
          offense:
            build_cost: 0
          general:
            build_cost: 2
          defense:
            build_cost: 2
    - key: engage_die
      label: "Die"
      type: dropdown
      default: d20
      visibility_when: engage_mode
      show_when: generic
      options:
        - value: d20
          label: "d20"
    - key: engage_other
      label: "Other Roll Text"
      type: free_text
      visibility_when: engage_mode
      show_when: other
    - key: counter_trait
      label: "Saving Throw"
      type: multiselect
      default_count: 2
      options_source: traits_all
      row_defaults:
        - value: "defense.Dexterity"
        - value: "defense.Constitution"
      row_fields:
        - key: value
          label: "Saving Throw"
          type: dropdown
          options_source: traits_all
          # A saving throw is expected to use a Defensive ability. Choosing an
          # ability from another category costs extra build points.
          group_offsets:
            default_group: defense
            offsets:
              defense:
                build_cost: 0
              offense:
                build_cost: 2
              general:
                build_cost: 2
      per_item:
        increase:
          build_cost: 0
          energy_cost: 0
        decrease:
          build_cost: 3
          energy_cost: 1
