    vitals:
      hp: 28
      movement: 8
      energy: 25
enactments:
  information: "What is this going to do?"
  render_information: false
  amplification:
    name: "Enact Amplification"
    description: "Enact Amplification allows you to increase the effect of an enactment you or someone else are the target for. It always has a Amplification Die which determines the amplification of the effect."
    information: "Enact Amplification allows you to increase the effect of an enactment you or someone else are the target for. It always has an Amplification Die which determines the amplification of the effect."
    render_information: false
    base_energy: 0

    base_action: 0
    fields:
      - key: comment
        label: "Comment"
        type: free_text
      - key: mode
        label: "Amplification Mode"
        type: dropdown
        default: die_roll
        information: "Choose how the amplification is determined: a fixed die-size shift up/down the die ladder, or a die roll."
        options:
          - value: die_shift
            label: "Die Shift"
          - value: die_roll
            label: "Die Roll"
      - key: shift_amount
        label: "Die Shift -/+"
        type: free_number
        default: 0
        min: -6
        max: 6
        step: 1
        visibility_when: mode
        show_when: die_shift
        information: "How many die-sizes the target effect is shifted up (+) or down (-)."
        per_step:
          increase:
            build_cost: 0
            energy_cost: 0
          decrease:
            build_cost: 0
            energy_cost: 0
      - key: amplification
        label: "Amplification"
        type: dropdown
        default: d4
        options_source: roll_generic
        visibility_when: mode
        show_when: die_roll
        information: "The die rolled to determine how much the target effect is amplified. Larger dice amplify more but cost more to build."
      - key: flat

        label: "Flat Bonus"
        type: free_number
        default: 0
        min: 0
        max: 8
        step: 1
        per_step:
          increase:
            build_cost: 0
            energy_cost: 0
          decrease:
            build_cost: 0
            energy_cost: 0

  condition:
    type: "Enact Condition"
    description: "Enact State will apply a conditon to a target (e.g., prone, stunned, charmed). A Condition will always have a value"
    information: "Enact State will apply a condition to a target (e.g., prone, stunned, charmed). A Condition will always have a value."
    render_information: false
    base_cost:

      build_cost: 0
      energy_cost: 0
    fields:
      - key: comment
        label: "Comment"
        type: free_text
      - key: condition
        label: "Condition"
        type: dropdown
        options_source: conditions_all
        shift_key: shift_amount
      - key: duration
        label: "Duration (turns)"
        type: dropdown
        default: "1"
        options:
          - value: "1"
            label: "1 turn"
          - value: "2"
            label: "2 turns"
            cost:
              build_cost: 0
          - value: "3"
            label: "3 turns"
            cost:
              build_cost: 0
          - value: "4"
            label: "4 turns"
            cost:
              build_cost: 0
          - value: "5"
            label: "5 turns"
            cost:
              build_cost: 0
          - value: "6"
            label: "6 turns"
            cost:
              build_cost: 0
          - value: "unlimited"
            label: "Unlimited"
            cost:
              build_cost: 0
              energy_cost: 0
      - key: solution
        label: "Solutions"
        type: multiselect
        default_count: 2
        row_fields:
          - key: value
            label: "Solution"
            type: dropdown
            options_source: traits_general_defense
            group_offsets:
              default_group: defense
              offsets:
                general:
                  build_cost: 0
        per_item:
          increase:
            build_cost: 0
            energy_cost: 0
          decrease:
            build_cost: 0
            energy_cost: 0

  damage:
    type: "Enact Damage"
    description: "Enact Damage allows characters to inflict harm on their enemies. It always has a Source Die and can have added bonusses."
    information: "Enact Damage allows characters to inflict harm on their enemies. It always has a Source Die and can have added bonuses."
    render_information: false
    base_cost:

      build_cost: 0
      energy_cost: 0
    fields:
      - key: comment
        label: "Comment"
        type: free_text
      - key: source
        label: "Source"
        type: dropdown
        options_source: traits_generic_offense
        information: "The offensive trait whose die is rolled for damage. Higher proficiency in the trait means a larger die."
      - key: flat
        label: "Flat Bonus"
        type: free_number
        default: 0
        min: 0
        max: 20
        step: 1
        per_step:
          increase:
            build_cost: 0
            energy_cost: 0
      - key: damage_type
        label: "Damage Types"
        type: multiselect
        default_count: 1
        options_source: damage_types
        row_fields:
          - key: value
            label: "Damage Type"
            type: dropdown
            options_source: damage_types
        per_item:
          increase:
            build_cost: 0
            energy_cost: 0
          decrease:
            build_cost: 0
            energy_cost: 0

  persistent_effect:
    type: "Enact Effect"
    description: "The Enact Effect applies a lingering effect to a target, such as fire, frost, or poison damage. By default, the effect lasts for {{fieldDefault (enactment \"effect\") \"duration\"}} rounds and triggers at either the start of the target's turn. On the targets turn they can re-roll the solution again to get rid fo the effect or take an action to remove it."
    information: "The Enact Effect applies a lingering effect to a target, such as fire, frost, or poison damage. By default, the effect lasts for a few rounds and triggers at the start of the target's turn. On the target's turn they can re-roll the solution to get rid of the effect or take an action to remove it."
