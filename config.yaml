        row_fields:
          - key: value
            label: "Solution"
            type: dropdown
            options_source: traits_general_defense
            group_offsets:
              default_group: defense
              offsets:
                general:
                  build_cost: 0
        per_item:
          increase:
            build_cost: 0
            energy_cost: 0
          decrease:
            build_cost: 0
            energy_cost: 0

  healing:
    type: "Enact Healing"
    description: "Enact Healing abilities allow characters to restore health to themselves or others. It always has a Source Die and may contain onter bonusses."
    information: "Enact Healing abilities allow characters to restore health to themselves or others. It always has a Source Die and may contain other bonuses."
