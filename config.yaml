ability_types:
  information: "Decide the timing of when the ability triggers"
  render_information: false
  execution:
    name: "Execution"
    information: "Execution is the most basic form for an Ability. It is simply the: \"I want to do this now\" Ability Type. Executions can be anything from casting a fireball to summoning a shield to block an attack or preparing a parry."
    render_information: false
    base_energy: 3
    base_action: 2
    fields:
      - key: comment
        label: "Comment"
        type: free_text
      - key: energy_steps
        label: "Energy +/-"
        type: free_number
        information: "Adjust the Energy cost of this ability. Lowering energy costs extra build points; raising it refunds some."
        default: 0
        min: -2
        max: 2
        step: 1
        per_step:
          increase:
            build_cost: 2
            energy_cost: 0
          decrease:
            build_cost: 0
            energy_cost: 1
      - key: action_steps
        label: "Action +/-"
        type: free_number
        information: "Adjust the amount of Actions it will cost to use this ability"
        default: 0
        min: -1
        max: 1
        step: 1
        per_step:
          increase:
            build_cost: 2
            energy_cost: 0
          decrease:
            build_cost: 0
            energy_cost: 0

  reaction:
    name: "Reaction"
    description: "Triggered in response to an event or enemy action."
    information: "Reactions are Abilities that trigger outside your normal action economy. Reactions trigger when someone else does something. When the trigger happens, the linked Enactment is executed. For example, you could have a reaction that triggers whenever someone runs towards you, Enacting a healing effect on yourself."
    render_information: false
    base_energy: 3
    base_action: 0
    base_range: 1
    base_uses: 1
    fields:
      - key: comment
        label: "Comment"
        type: free_text
      - key: energy_steps
        label: "Energy +/-"
        type: free_number
        default: 0
        min: -2
        max: 2
        step: 1
        per_step:
          increase:
            build_cost: 02
            energy_cost: 0
          decrease:
            build_cost: 0
            energy_cost: 01
      - key: triggers
        label: "Triggers"
