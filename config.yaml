  concentration:
    name: "Concentration"
    description: "An effect that persists over multiple rounds as long as the Engager maintains focus. It costs Actions and Energy to initiate, then re-triggers its Enactments every round as long as the upkeep is paid."
    information: "Concentration is an Ability Type that allows an effect to persist over multiple rounds, as long as the Engager actively maintains focus. It takes one action to start the Concentration and then at the start of each of your turns you have to spend energy for the upkeep."
    render_information: false
    base_energy: 3

    base_action: 2
    base_upkeep_action: 1
    base_upkeep_energy: 1
    fields:
