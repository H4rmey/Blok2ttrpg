name: Shove
description: "A blunt two-handed push that sends an enemy stumbling backwards out of reach."
type: execution
tags: [movement, control, melee]
# The plain end of the forced-movement trio: this pushes and nothing else.
# Hooked Chain pulls and then restrains, Gale Step pushes them and moves you
# into the space they left. Keeping this one bare is what makes it the cheap
# option rather than a worse version of the other two.
fields:
  comment: Push an enemy away from you.
  energy_steps: 0
  action_steps: 0
enactments:
  - type: motion
    fields:
      comment: Forced movement, two meters.
      distance: 2
      direction:
        - value: Away
    interaction: direct
    interaction_data:
      comment: ""
      range: "1"
      targets: 1
    validation_data:
      comment: ""
      engage: d6
      counter_skill:
        - value: defense.Constitution
