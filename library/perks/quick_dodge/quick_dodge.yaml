name: Quick Dodge
description: "You read the swing coming and are not where it lands."
type: reaction
tags: [defense, reaction, self]
fields:
  comment: Slip aside the moment an attack comes in at you.
  # Fires when an attack aimed at you actually connects, which is the moment a
  # dodge is worth spending energy on. Range 0 keeps it to yourself: this is your
  # own footwork, not a rescue of someone else.
  trigger: attack_hits
  trigger_range: 0
enactments:
  - type: negation
    fields:
      comment: You are simply not there any more.
    interaction: self
    interaction_data:
      comment: ""
    validation_data:
      comment: ""
      engage: defense.Reflex
      counter_skill:
        - value: defense.Reflex
