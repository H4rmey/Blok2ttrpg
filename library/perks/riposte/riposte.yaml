name: Riposte
description: "You turn the blow aside on your guard and answer it along the same line before they recover."
type: reaction
tags: [defense, damage, reaction]
fields:
  comment: Nullify an attack, then punish it.
  # attack_misses is the trigger this perk was written for: the swing already
  # resolved and failed, so the opening exists before they recover. Range 0
  # keeps it to attacks aimed at you - this is your guard, not a rescue.
  trigger: attack_misses
  trigger_range: 0
  energy_steps: 0
  action_steps: 0
enactments:
  - type: negation
    fields:
      comment: The attack slides off your guard.
    interaction: self
    interaction_data:
      comment: ""
    validation_data:
      comment: ""
      engage: d6
      counter_skill:
        - value: defense.Reflex
  - type: damage
    # The counter-thrust goes back at the attacker, not at you, so this
    # enactment buys its own target.
    new_target: true
    fields:
      comment: Straight back down the line.
      source: offense.Precision
      flat: 0
      damage_type:
        - value: Piercing
    interaction: direct
    interaction_data:
      comment: ""
      range: "1"
      targets: 1
    validation_data:
      comment: ""
      engage: d6
      counter_skill:
        - value: defense.Reflex
