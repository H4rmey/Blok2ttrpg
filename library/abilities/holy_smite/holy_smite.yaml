name: Holy Smite
description: "Radiant judgement falls on your enemy while the same light settles as a blessing on you."
type: execution
fields:
  comment: Radiant damage and a self blessing.
  energy_steps: 0
  action_steps: 0
enactments:
  - type: damage
    fields:
      comment: Radiant judgement.
      source: offense.Magic
      flat: 0
      damage_type:
        - value: Radiant
    interaction: direct
    interaction_data:
      comment: ""
      range: "1"
      targets: 1
    validation_data:
      comment: ""
      engage: d6
      counter_skill:
        - value: defense.Wisdom
  - type: condition
    # The blessing lands on you, not on the enemy the first enactment struck,
    # so this enactment buys its own target.
    new_target: true
    fields:
      comment: You are wreathed in holy light.
      condition: blessed
      duration: "1"
      solution:
        - value: defense.Wisdom
      solution_dc: 0
    interaction: self
    interaction_data:
      comment: ""
    validation_data:
      comment: ""
      engage: d6
      counter_skill:
        - value: defense.Wisdom
