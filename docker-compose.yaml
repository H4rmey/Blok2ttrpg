services:
  blok2ttrpg:
    build: .
    image: blok2ttrpg:latest
    container_name: blok2ttrpg
    ports:
      - "4040:8080"
    environment:
      # Port the server listens on inside the container.
      PORT: "8080"
      # Game system to load. This selects both the ruleset (config/<system>)
      # and the built-in library (library/<system>). Set to "dnd" to run the
      # D&D system instead of the default ability-builder.
      SYSTEM: "ability-builder"
      # Optional: point at an explicit config path (overrides SYSTEM).
      # CONFIG: "config/ability-builder"

    volumes:
      # Persist character data across container restarts/rebuilds.
      - blok2-data:/app/data
    restart: unless-stopped

volumes:
  blok2-data:
