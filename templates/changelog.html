{{ define "changelog.html" }}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .Title }}</title>
  <link rel="stylesheet" href="/static/css/app.css?v=10">
  <script src="/static/js/htmx.min.js"></script>
</head>
<body>
  {{/* The changelog and docs pages stand outside the character-scoped layout,
       so each carries its own header. They share the topbar classes so the
       responsive behaviour is identical everywhere. */}}
  <header class="topbar">
    <a href="/" class="brand">Home</a>
    <button id="nav-toggle" class="nav-toggle" type="button"
            aria-expanded="false" aria-controls="nav-links" aria-label="Menu">&#9776;</button>
    <nav id="nav-links">
      <a href="/docs">Docs</a>
      <a href="/changelog/markdown">Download Markdown</a>
      <button type="button" class="btn" onclick="window.print()">Print / Save PDF</button>
    </nav>
    <button id="theme-toggle" type="button" title="Toggle theme">&#9788;</button>
  </header>
  <main class="content docs changelog">
    {{ .Content }}
  </main>
  <script src="/static/js/app.js?v=9"></script>
</body>
</html>
{{ end }}
