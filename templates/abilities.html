{{ template "head" . }}
{{ $c := .Character }}
<div class="page-head">
  <h1>Perks</h1>
  <div class="toolbar">
    <button class="btn primary" type="button" onclick="document.getElementById('new-ability-modal').showModal()">+ New Perk</button>

    <button class="btn" type="button"
            hx-get="/abilities/library?character={{ $c.ID }}"
            hx-target="#ability-modal-body" hx-swap="innerHTML"
            onclick="openAbilityModal()">Import from Library</button>
    <button class="btn" type="button"
            onclick="document.getElementById('ability-import-input').click()">Import Custom</button>
    {{/* Recomputes the point and energy cost of every perk from the current
         config and swaps the list in place. */}}
    <button class="btn" type="button" title="Recalculate the cost of every perk"
            hx-get="/characters/{{ $c.ID }}/abilities/refresh"
            hx-target="#perk-list" hx-swap="innerHTML">&#8635; Refresh All</button>
    <form id="ability-import-form" action="/characters/{{ $c.ID }}/abilities/import-custom" method="post" enctype="multipart/form-data" hidden>
      <input id="ability-import-input" type="file" name="file" accept=".yaml,.yml" onchange="this.form.submit()">
    </form>
  </div>
</div>

{{ template "character_bar" . }}

<div id="ability-modal" class="modal" hidden>
  <div class="modal-backdrop" onclick="closeAbilityModal()"></div>
  <div class="modal-content" id="ability-modal-body"></div>
</div>

<dialog id="new-ability-modal">
  <form method="get" action="/characters/{{ $c.ID }}/abilities/new">
    <h2>New Perk</h2>
    <label for="new-ability-name">Name</label>
    <input id="new-ability-name" type="text" name="name" placeholder="Perk name" required autofocus>
    <div class="toolbar">
      <button class="btn primary" type="submit">Create</button>
      <button class="btn" type="button" onclick="document.getElementById('new-ability-modal').close()">Cancel</button>
    </div>
  </form>
</dialog>

<div id="perk-list">
  {{ template "perk_list" . }}
</div>
{{ template "foot" . }}
