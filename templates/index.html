{{ template "head" . }}
<h1>Characters</h1>
<div class="toolbar">
  <button class="btn" type="button" onclick="document.getElementById('new-character-modal').showModal()">+ New Character</button>
  <button class="btn" type="button" onclick="document.getElementById('character-import-input').click()">Import YAML</button>
  <form id="character-import-form" action="/characters/import" method="post" enctype="multipart/form-data" hidden>
    <input id="character-import-input" type="file" name="file" accept=".yaml,.yml" onchange="this.form.submit()">
  </form>

</div>

<dialog id="new-character-modal">
  <form method="post" action="/characters/create">
    <h2>New Character</h2>
    <label for="new-character-name">Name</label>
    <input id="new-character-name" type="text" name="attr_name" placeholder="Character name" required autofocus>
    <div class="toolbar">
      <button class="btn primary" type="submit">Create</button>
      <button class="btn" type="button" onclick="document.getElementById('new-character-modal').close()">Cancel</button>
    </div>
  </form>
</dialog>

{{ if .Characters }}
<ul class="card-grid">
  {{ range .Characters }}
  <li class="card">
    <a href="/characters/{{ .ID }}"><strong>{{ .Name }}</strong></a>
    <span class="muted">Level {{ .Level }} &middot; {{ len .Abilities }} abilities</span>
  </li>
  {{ end }}
</ul>
{{ else }}
<p class="muted">No characters yet. Create one to get started.</p>
{{ end }}
{{ template "foot" . }}
